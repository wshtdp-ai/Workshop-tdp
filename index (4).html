<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12345a"><link rel="manifest" href="manifest.webmanifest"><title>Workshop TDP</title>
<style>
:root{font-family:Arial,sans-serif;color:#172334;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#12345a;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:20px;margin:0}main{max-width:1100px;margin:22px auto;padding:0 14px}.card{background:#fff;border:1px solid #dce3eb;border-radius:12px;padding:18px;margin-bottom:16px}input,select,textarea,button{font:inherit;padding:11px;border-radius:8px;border:1px solid #cbd5e1;width:100%;margin:5px 0}textarea{min-height:80px}button{background:#12345a;color:#fff;border:0;font-weight:bold;cursor:pointer}button.secondary{background:#e7edf5;color:#12345a}.hidden{display:none}.muted{color:#64748b;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}nav button{width:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:left;vertical-align:top}th{background:#eaf0f7}.scroll{overflow-x:auto}.msg{white-space:pre-wrap;font-size:13px;color:#b42318}.success{color:#067647}.field{display:flex;flex-direction:column}.actions{display:flex;gap:8px}.actions button{width:auto}.tag{display:inline-block;background:#e7edf5;padding:4px 8px;border-radius:20px;font-size:12px}
</style></head><body>
<header><div><h1>Workshop PT TRANS DAYA PRIMA</h1><small>Manajemen unit · SPK · Preventive Maintenance</small></div><button id="logout" class="secondary hidden" style="width:auto">Keluar</button></header>
<main>
<section id="setup" class="card"><h2>Pengaturan koneksi Supabase</h2><p class="muted">Gunakan Project URL dan publishable key. Jangan gunakan service_role key.</p><label>Project URL</label><input id="url" placeholder="https://xxxx.supabase.co"><label>Anon / Publishable key</label><input id="key" placeholder="Supabase publishable key"><button id="saveConfig">Simpan koneksi</button><p id="setupStatus" class="muted"></p></section>
<section id="login" class="card hidden"><h2>Masuk Workshop TDP</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Masuk</button><p id="loginStatus" class="msg"></p></section>
<section id="app" class="hidden"><div class="card"><h2 id="welcome">Dashboard</h2><p id="role" class="muted"></p><nav><button data-page="dashboard">Dashboard</button><button data-page="vehicles">Master Unit</button><button data-page="spk">SPK</button><button data-page="pm">Preventive Maintenance</button></nav><div id="page"></div></div></section>
</main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const $=id=>document.getElementById(id);let supabase=null,profile=null;
const esc=v=>String(v??'-').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function say(id,msg,ok=false){$(id).textContent=msg;$(id).className=ok?'msg success':'msg'}
function init(){let u=localStorage.getItem('tdp_supabase_url'),k=localStorage.getItem('tdp_supabase_key');if(u&&k){$('url').value=u;$('key').value=k;supabase=createClient(u,k);$('setup').classList.add('hidden');$('login').classList.remove('hidden')}}
$('saveConfig').onclick=()=>{let u=$('url').value.trim(),k=$('key').value.trim();if(!u.startsWith('https://')||!k)return say('setupStatus','Periksa Project URL dan publishable key.');localStorage.setItem('tdp_supabase_url',u);localStorage.setItem('tdp_supabase_key',k);supabase=createClient(u,k);$('setup').classList.add('hidden');$('login').classList.remove('hidden')};
$('loginBtn').onclick=async()=>{say('loginStatus','Memeriksa akun...');let {data,error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return say('loginStatus',error.message);let p=await supabase.from('profiles').select('full_name,roles').eq('id',data.user.id).single();if(p.error)return say('loginStatus','Profil belum terbaca: '+p.error.message);profile=p.data;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');$('welcome').textContent='Selamat datang, '+(profile.full_name||'Pengguna');$('role').textContent='Hak akses: '+(profile.roles||[]).join(', ');show('dashboard')};
$('logout').onclick=async()=>{await supabase.auth.signOut();location.reload()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.page));
async function show(name){let p=$('page');if(name==='dashboard'){await dashboardPage();return}
if(name==='vehicles'){p.innerHTML='<h3>Master Unit</h3><div id="vrows" class="muted">Memuat data...</div>';let {data,error}=await supabase.from('vehicles').select('*').order('plate_number').limit(200);if(error)return $('vrows').textContent=error.message;if(!data.length)return $('vrows').textContent='Belum ada data unit.';$('vrows').innerHTML=`<p class="muted">Jumlah unit: ${data.length}</p><div class="scroll"><table><thead><tr><th>No.</th><th>Nomor Polisi</th><th>Merek</th><th>Jenis</th><th>Model</th><th>Tahun</th><th>Status</th></tr></thead><tbody>${data.map((v,i)=>`<tr><td>${i+1}</td><td>${esc(v.plate_number)}</td><td>${esc(v.brand)}</td><td>${esc(v.vehicle_type)}</td><td>${esc(v.model)}</td><td>${esc(v.year)}</td><td>${esc(v.status)}</td></tr>`).join('')}</tbody></table></div>`;return}
if(name==='spk'){await spkPage();return}
p.innerHTML='<h3>Preventive Maintenance</h3><p>Modul PM akan diaktifkan setelah formulir SPK selesai diuji.</p>'}

async function dashboardPage(){
let p=$('page');
p.innerHTML='<h3>Dashboard Workshop</h3><p class="muted">Ringkasan data langsung dari database Supabase.</p><div class="grid" id="dashcards"><div class="card">Memuat ringkasan...</div></div><h4>SPK Terbaru</h4><div id="dashrecent" class="muted">Memuat daftar...</div>';
let [vc,wc,all,recent]=await Promise.all([
supabase.from('vehicles').select('*',{count:'exact',head:true}),
supabase.from('work_orders').select('*',{count:'exact',head:true}),
supabase.from('work_orders').select('result_status,created_at'),
supabase.from('work_orders').select('spk_number,complaint,result_status,work_date,created_at,vehicles(plate_number)').order('created_at',{ascending:false}).limit(10)
]);
if(vc.error||wc.error||all.error||recent.error){
$('dashcards').innerHTML='<div class="card msg">Gagal memuat dashboard: '+esc((vc.error||wc.error||all.error||recent.error).message)+'</div>';
$('dashrecent').textContent='Periksa kembali akses database.';
return;
}
let rows=all.data||[],today=new Date().toISOString().slice(0,10);
let todayCount=rows.filter(x=>(x.created_at||'').slice(0,10)===today).length;
let done=rows.filter(x=>(x.result_status||'').toLowerCase().includes('selesai')).length;
let working=rows.filter(x=>{let st=(x.result_status||'').toLowerCase();return st.includes('kerja')&&!st.includes('selesai')}).length;
let pending=rows.filter(x=>(x.result_status||'').toLowerCase().includes('tunda')).length;
let cards=[['Total Unit',vc.count??0],['Total SPK',wc.count??0],['SPK Hari Ini',todayCount],['Dalam Pengerjaan',working],['SPK Selesai',done],['Tertunda',pending]];
$('dashcards').innerHTML=cards.map(([label,val])=>`<div class="card"><div class="muted">${label}</div><div style="font-size:28px;font-weight:bold;margin-top:8px">${val}</div></div>`).join('');
if(!recent.data.length){$('dashrecent').textContent='Belum ada SPK.';return}
$('dashrecent').innerHTML='<div class="scroll"><table><thead><tr><th>Nomor SPK</th><th>Nomor Polisi</th><th>Tanggal</th><th>Status</th><th>Keluhan</th></tr></thead><tbody>'+recent.data.map(x=>`<tr><td>${esc(x.spk_number)}</td><td>${esc(x.vehicles?.plate_number)}</td><td>${esc(x.work_date||x.created_at?.slice(0,10))}</td><td><span class="tag">${esc(x.result_status)}</span></td><td>${esc(x.complaint)}</td></tr>`).join('')+'</tbody></table></div>';
}

function makeNo(){let d=new Date(),pad=n=>String(n).padStart(2,'0');return `SPK-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`}
async function spkPage(){let p=$('page');p.innerHTML='<h3>SPK / Surat Perintah Kerja</h3><div id="spkform" class="card"><h4>Buat SPK Baru</h4><div class="grid"><div class="field"><label>Nomor SPK otomatis</label><input id="spkno" readonly></div><div class="field"><label>Tanggal permintaan</label><input id="reqdate" type="date"></div><div class="field"><label>Unit kendaraan</label><select id="vehicle"><option value="">Memuat unit...</option></select></div><div class="field"><label>Nama sopir</label><input id="driver" placeholder="Nama sopir"></div><div class="field"><label>Jenis pekerjaan</label><select id="worktype"><option>Perbaikan</option><option>Preventive Maintenance</option><option>Inspeksi</option><option>Darurat</option></select></div><div class="field"><label>Tanggal pengerjaan</label><input id="workdate" type="date"></div><div class="field"><label>PIC / pelapor</label><input id="pic" placeholder="Nama PIC"></div><div class="field"><label>Pilih mekanik (bisa lebih dari satu)</label><div id="mechanicList" class="card" style="margin:0;padding:10px">Memuat mekanik...</div></div></div><label>Keluhan / permintaan perbaikan</label><textarea id="complaint" placeholder="Jelaskan keluhan kendaraan"></textarea><label>Alasan / pekerjaan yang diminta</label><textarea id="reason" placeholder="Jelaskan pekerjaan yang harus dilakukan"></textarea><button id="saveSpk">Simpan SPK</button><p id="spkmsg" class="msg"></p></div><h4>Daftar SPK Terbaru</h4><div id="spkrows" class="muted">Memuat data...</div>';
let today=new Date().toISOString().slice(0,10);$('spkno').value=makeNo();$('reqdate').value=today;$('workdate').value=today;
let [v,m]=await Promise.all([supabase.from('vehicles').select('id,plate_number,brand,model').order('plate_number'),supabase.from('mechanics').select('id,name').eq('is_active',true).order('name')]);
if(v.error)return say('spkmsg','Gagal memuat unit: '+v.error.message);$('vehicle').innerHTML='<option value="">Pilih kendaraan</option>'+v.data.map(x=>`<option value="${x.id}">${esc(x.plate_number)} — ${esc(x.brand)} ${esc(x.model)}</option>`).join('');
if(m.error)return say('spkmsg','Gagal memuat mekanik: '+m.error.message);
$('mechanicList').innerHTML=m.data.length?m.data.map(x=>`<label style="display:flex;align-items:center;gap:8px;margin:8px 0"><input type="checkbox" class="mechanic-check" value="${x.id}" style="width:auto;margin:0"> ${esc(x.name)}</label>`).join(''):'Belum ada mekanik aktif.';
$('saveSpk').onclick=async()=>{let btn=$('saveSpk');if(!$('vehicle').value||!$('complaint').value.trim())return say('spkmsg','Pilih unit dan isi keluhan terlebih dahulu.');btn.disabled=true;btn.textContent='Menyimpan...';let selected=[...document.querySelectorAll('.mechanic-check:checked')].map(x=>x.value);let payload={spk_number:$('spkno').value,vehicle_id:$('vehicle').value,driver_name:$('driver').value.trim()||null,complaint:$('complaint').value.trim(),repair_reason:$('reason').value.trim()||null,pic_name:$('pic').value.trim()||null,mechanic_id:null,work_type:$('worktype').value,request_date:$('reqdate').value||null,work_date:$('workdate').value||null,result_status:'Dibuat'};let {data:created,error}=await supabase.from('work_orders').insert(payload).select('id').single();if(error){btn.disabled=false;btn.textContent='Simpan SPK';say('spkmsg','SPK gagal disimpan: '+error.message);return}
if(selected.length){let taskRows=selected.map(mid=>({work_order_id:created.id,task_description:'Pekerjaan mekanik pada SPK '+payload.spk_number}));let {data:tasks,error:taskError}=await supabase.from('work_order_tasks').insert(taskRows).select('id');if(taskError){btn.disabled=false;btn.textContent='Simpan SPK';say('spkmsg','SPK tersimpan, tetapi tugas mekanik gagal dibuat: '+taskError.message);return}
let assignments=selected.map((mid,i)=>({work_order_id:created.id,task_id:tasks[i].id,mechanic_id:mid,status:'Ditugaskan'}));let {error:assignError}=await supabase.from('work_order_assignments').insert(assignments);if(assignError){btn.disabled=false;btn.textContent='Simpan SPK';say('spkmsg','SPK tersimpan, tetapi penugasan mekanik gagal: '+assignError.message);return}}
btn.disabled=false;btn.textContent='Simpan SPK';say('spkmsg','SPK berhasil disimpan: '+payload.spk_number+' | Mekanik ditugaskan: '+selected.length,true);$('spkno').value=makeNo();$('driver').value='';$('pic').value='';$('complaint').value='';$('reason').value='';document.querySelectorAll('.mechanic-check').forEach(x=>x.checked=false);await loadSpkList()};
await loadSpkList()}
async function loadSpkList(){let box=$('spkrows');let {data,error}=await supabase.from('work_orders').select('id,spk_number,work_date,work_type,result_status,complaint,vehicles(plate_number)').order('created_at',{ascending:false}).limit(50);if(error){box.textContent='Gagal memuat daftar SPK: '+error.message;return}if(!data.length){box.textContent='Belum ada SPK. Silakan buat SPK pertama.';return}box.innerHTML='<div class="scroll"><table><thead><tr><th>Nomor SPK</th><th>Unit</th><th>Tanggal</th><th>Jenis</th><th>Status</th><th>Keluhan</th></tr></thead><tbody>'+data.map(x=>`<tr><td>${esc(x.spk_number)}</td><td>${esc(x.vehicles?.plate_number)}</td><td>${esc(x.work_date)}</td><td>${esc(x.work_type)}</td><td><span class="tag">${esc(x.result_status)}</span></td><td>${esc(x.complaint)}</td></tr>`).join('')+'</tbody></table></div>'}
init();
</script></body></html>
