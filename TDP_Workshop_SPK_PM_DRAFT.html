<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12345a"><link rel="manifest" href="manifest.webmanifest"><title>Workshop TDP - Status SPK</title>
<style>
:root{font-family:Arial,sans-serif;color:#172334;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#12345a;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:20px;margin:0}main{max-width:1100px;margin:22px auto;padding:0 14px}.card{background:#fff;border:1px solid #dce3eb;border-radius:12px;padding:18px;margin-bottom:16px}input,select,textarea,button{font:inherit;padding:11px;border-radius:8px;border:1px solid #cbd5e1;width:100%;margin:5px 0}textarea{min-height:80px}button{background:#12345a;color:#fff;border:0;font-weight:bold;cursor:pointer}button.secondary{background:#e7edf5;color:#12345a}.hidden{display:none}.muted{color:#64748b;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}nav button{width:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:left;vertical-align:top}th{background:#eaf0f7}.scroll{overflow-x:auto}.msg{white-space:pre-wrap;font-size:13px;color:#b42318}.success{color:#067647}.field{display:flex;flex-direction:column}.actions{display:flex;gap:8px}.actions button{width:auto}.tag{display:inline-block;background:#e7edf5;padding:4px 8px;border-radius:20px;font-size:12px}
</style></head><body>
<header><div><h1>Workshop PT TRANS DAYA PRIMA</h1><small>Manajemen unit · SPK · Preventive Maintenance</small></div><button id="logout" class="secondary hidden" style="width:auto">Keluar</button></header>
<main>
<section id="setup" class="card"><h2>Pengaturan koneksi Supabase</h2><p class="muted">Gunakan Project URL dan publishable key. Jangan gunakan service_role key.</p><label>Project URL</label><input id="url" placeholder="https://xxxx.supabase.co"><label>Anon / Publishable key</label><input id="key" placeholder="Supabase publishable key"><button id="saveConfig">Simpan koneksi</button><p id="setupStatus" class="muted"></p></section>
<section id="login" class="card hidden"><h2>Masuk Workshop TDP</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Masuk</button><p id="loginStatus" class="msg"></p></section>
<section id="app" class="hidden"><div class="card"><h2 id="welcome">Dashboard</h2><p id="role" class="muted"></p><nav><button data-page="dashboard">Dashboard</button><button data-page="vehicles">Master Unit</button><button data-page="spk">SPK</button><button data-page="mechanic-history">Riwayat SPK Mekanik</button><button data-page="pm">Preventive Maintenance</button><button data-page="downtime">Downtime Kendaraan</button><button data-page="cost-report">Laporan Biaya</button><button data-page="pm">Preventive Maintenance</button></nav><div id="page"></div></div></section>
</main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const $=id=>document.getElementById(id);let supabase=null,profile=null;
const esc=v=>String(v??'-').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function say(id,msg,ok=false){$(id).textContent=msg;$(id).className=ok?'msg success':'msg'}
function init(){let u=localStorage.getItem('tdp_supabase_url'),k=localStorage.getItem('tdp_supabase_key');if(u&&k){$('url').value=u;$('key').value=k;supabase=createClient(u,k);$('setup').classList.add('hidden');$('login').classList.remove('hidden')}}
$('saveConfig').onclick=()=>{let u=$('url').value.trim(),k=$('key').value.trim();if(!u.startsWith('https://')||!k)return say('setupStatus','Periksa Project URL dan publishable key.');localStorage.setItem('tdp_supabase_url',u);localStorage.setItem('tdp_supabase_key',k);supabase=createClient(u,k);$('setup').classList.add('hidden');$('login').classList.remove('hidden')};
$('loginBtn').onclick=async()=>{say('loginStatus','Memeriksa akun...');let {data,error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return say('loginStatus',error.message);let p=await supabase.from('profiles').select('full_name,roles').eq('id',data.user.id).single();if(p.error)return say('loginStatus','Profil belum terbaca: '+p.error.message);profile=p.data;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');$('welcome').textContent='Selamat datang, '+(profile.full_name||'Pengguna');$('role').textContent='Hak akses: '+(profile.roles||[]).join(', ');show('dashboard')};
$('logout').onclick=async()=>{await supabase.auth.signOut();location.reload()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.page));
async function show(name){let p=$('page');if(name==='dashboard'){await dashboardPage();return}
if(name==='vehicles'){p.innerHTML='<h3>Master Unit</h3><div id="vrows" class="muted">Memuat data...</div>';let {data,error}=await supabase.from('vehicles').select('*').order('plate_number').limit(200);if(error)return $('vrows').textContent=error.message;if(!data.length)return $('vrows').textContent='Belum ada data unit.';$('vrows').innerHTML=`<p class="muted">Jumlah unit: ${data.length}</p><div class="scroll"><table><thead><tr><th>No.</th><th>Nomor Polisi</th><th>Merek</th><th>Jenis</th><th>Model</th><th>Tahun</th><th>Status</th><th>Riwayat</th></tr></thead><tbody>${data.map((v,i)=>`<tr><td>${i+1}</td><td>${esc(v.plate_number)}</td><td>${esc(v.brand)}</td><td>${esc(v.vehicle_type)}</td><td>${esc(v.model)}</td><td>${esc(v.year)}</td><td>${esc(v.status)}</td><td><button type="button" style="width:auto" onclick="window.showVehicleHistory('${v.id}')">Lihat riwayat</button></td></tr>`).join('')}</tbody></table></div>`;return}
if(name==='spk'){await spkPage();return}
if(name==='mechanic-history'){await mechanicHistoryPage();return}
if(name==='downtime'){await downtimePage();return}
 if(name==='cost-report'){await costReportPage();return}
 if(name==='pm'){await pmPage();return}
p.innerHTML='<h3>Preventive Maintenance</h3><p>Modul PM akan diaktifkan setelah formulir SPK selesai diuji.</p>'}


window.showVehicleHistory=async(vehicleId)=>{
let box=$('vrows');box.innerHTML='<p class="muted">Memuat riwayat kendaraan...</p>';
let {data:vehicle,error:vError}=await supabase.from('vehicles').select('plate_number,brand,model').eq('id',vehicleId).single();
if(vError){box.textContent='Gagal memuat kendaraan: '+vError.message;return}
let {data:orders,error}=await supabase.from('work_orders').select('id,spk_number,request_date,work_date,work_type,complaint,repair_reason,result_status,driver_name,pic_name,created_at').eq('vehicle_id',vehicleId).order('created_at',{ascending:false});
if(error){box.textContent='Gagal memuat riwayat SPK: '+error.message;return}
let title=`Riwayat Kendaraan: ${esc(vehicle.plate_number)} — ${esc(vehicle.brand)} ${esc(vehicle.model)}`;
let rows=orders||[];
let assignmentMap={};
if(rows.length){
let ids=rows.map(x=>x.id).filter(Boolean);
let {data:assignments,error:assignmentError}=await supabase.from('work_order_assignments').select('work_order_id,status,mechanics(name)').in('work_order_id',ids);
if(!assignmentError){for(let a of (assignments||[])){let n=a.mechanics?.name||'Nama mekanik tidak tersedia';let st=a.status||'Ditugaskan';(assignmentMap[a.work_order_id]??=[]).push(n+' ('+st+')')}}
}
box.innerHTML=`<div class="actions"><button type="button" class="secondary" onclick="show('vehicles')">Kembali ke Master Unit</button></div><h3>${title}</h3><p class="muted">Total riwayat SPK: ${rows.length}</p>`+(rows.length?`<div class="scroll"><table><thead><tr><th>Nomor SPK</th><th>Tanggal</th><th>Jenis</th><th>Keluhan</th><th>Pekerjaan</th><th>Mekanik yang mengerjakan</th><th>Sopir</th><th>PIC</th><th>Status SPK</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.spk_number)}</td><td>${esc(x.work_date||x.request_date||x.created_at?.slice(0,10))}</td><td>${esc(x.work_type)}</td><td>${esc(x.complaint)}</td><td>${esc(x.repair_reason)}</td><td>${esc((assignmentMap[x.id]||[]).join(', ')||'Belum ada penugasan mekanik')}</td><td>${esc(x.driver_name)}</td><td>${esc(x.pic_name)}</td><td><span class="tag">${esc(x.result_status==='Dibuat'?'Pending':x.result_status||'Pending')}</span></td></tr>`).join('')}</tbody></table></div>`:'<p>Belum ada riwayat SPK untuk kendaraan ini.</p>');
};

async function dashboardPage(){
let p=$('page');
p.innerHTML='<h3>Dashboard Workshop</h3><p class="muted">Ringkasan data langsung dari database Supabase.</p><div class="grid" id="dashcards"><div class="card">Memuat ringkasan...</div></div><h4>SPK Terbaru</h4><div id="dashrecent" class="muted">Memuat daftar...</div>';
let [vc,wc,all,recent]=await Promise.all([
supabase.from('vehicles').select('*',{count:'exact',head:true}),
supabase.from('work_orders').select('*',{count:'exact',head:true}),
supabase.from('work_orders').select('result_status,created_at'),
supabase.from('work_orders').select('spk_number,complaint,result_status,work_date,created_at,vehicles(plate_number)').order('created_at',{ascending:false}).limit(10)
]);
if(vc.error||wc.error||all.error||recent.error){
$('dashcards').innerHTML='<div class="card msg">Gagal memuat dashboard: '+esc((vc.error||wc.error||all.error||recent.error).message)+'</div>';
$('dashrecent').textContent='Periksa kembali akses database.';
return;
}
let rows=all.data||[],today=new Date().toISOString().slice(0,10);
let todayCount=rows.filter(x=>(x.created_at||'').slice(0,10)===today).length;
let done=rows.filter(x=>(x.result_status||'').toLowerCase().includes('selesai')).length;
let working=rows.filter(x=>{let st=(x.result_status||'').toLowerCase();return st.includes('kerja')&&!st.includes('selesai')}).length;
let pending=rows.filter(x=>{let st=(x.result_status||'').toLowerCase();return st.includes('pending')||st.includes('tunda')||st==='dibuat'}).length;
let cards=[['Total Unit',vc.count??0],['Total SPK',wc.count??0],['SPK Hari Ini',todayCount],['Dalam Pengerjaan',working],['SPK Selesai',done],['Tertunda',pending]];
$('dashcards').innerHTML=cards.map(([label,val])=>`<div class="card"><div class="muted">${label}</div><div style="font-size:28px;font-weight:bold;margin-top:8px">${val}</div></div>`).join('');
if(!recent.data.length){$('dashrecent').textContent='Belum ada SPK.';return}
$('dashrecent').innerHTML='<div class="scroll"><table><thead><tr><th>Nomor SPK</th><th>Nomor Polisi</th><th>Tanggal</th><th>Status</th><th>Keluhan</th></tr></thead><tbody>'+recent.data.map(x=>`<tr><td>${esc(x.spk_number)}</td><td>${esc(x.vehicles?.plate_number)}</td><td>${esc(x.work_date||x.created_at?.slice(0,10))}</td><td><span class="tag">${esc(x.result_status)}</span></td><td>${esc(x.complaint)}</td></tr>`).join('')+'</tbody></table></div>';
}


async function mechanicHistoryPage(){
let p=$('page');
p.innerHTML='<h3>Riwayat SPK per Mekanik</h3><p class="muted">Pilih mekanik dan periode untuk melihat seluruh SPK yang pernah ditugaskan kepadanya.</p><div class="card"><div class="grid"><div class="field"><label>Nama mekanik</label><select id="mhMechanic"><option value="">Memuat mekanik...</option></select></div><div class="field"><label>Dari tanggal</label><input id="mhFrom" type="date"></div><div class="field"><label>Sampai tanggal</label><input id="mhTo" type="date"></div></div><div class="actions"><button id="mhSearch" type="button">Tampilkan riwayat</button><button id="mhReset" type="button" class="secondary">Reset tanggal</button></div><p id="mhMsg" class="msg"></p></div><div id="mhRows" class="muted">Pilih mekanik untuk melihat riwayat.</div>';
let {data:mechanics,error}=await supabase.from('mechanics').select('id,name').order('name');
if(error){$('mhMsg').textContent='Gagal memuat mekanik: '+error.message;return}
$('mhMechanic').innerHTML='<option value="">Pilih mekanik</option>'+(mechanics||[]).map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('');
$('mhSearch').onclick=loadMechanicHistory;
$('mhReset').onclick=()=>{$('mhFrom').value='';$('mhTo').value='';loadMechanicHistory()};
if(mechanics?.length===1){$('mhMechanic').value=mechanics[0].id}
}
async function loadMechanicHistory(){
let mid=$('mhMechanic').value,box=$('mhRows');
if(!mid){$('mhMsg').textContent='Pilih nama mekanik terlebih dahulu.';box.textContent='';return}
let from=$('mhFrom').value,to=$('mhTo').value;
if(from&&to&&from>to){$('mhMsg').textContent='Tanggal awal tidak boleh melewati tanggal akhir.';return}
$('mhMsg').textContent='';box.textContent='Memuat riwayat SPK...';
// Ambil SPK dari penugasan mekanik dan dukung juga data lama yang memakai work_orders.mechanic_id.
let [a,legacy]=await Promise.all([
supabase.from('work_order_assignments').select('work_order_id').eq('mechanic_id',mid),
supabase.from('work_orders').select('id').eq('mechanic_id',mid)
]);
if(a.error&&legacy.error){box.textContent='Gagal membaca riwayat mekanik: '+a.error.message;return}
let ids=[...new Set([...(a.data||[]).map(x=>x.work_order_id),...(legacy.data||[]).map(x=>x.id)].filter(Boolean))];
if(!ids.length){box.innerHTML='<p>Belum ada SPK yang tercatat untuk mekanik ini.</p>';return}
let {data:orders,error}=await supabase.from('work_orders').select('id,spk_number,request_date,work_date,work_type,complaint,repair_reason,result_status,driver_name,pic_name,created_at,vehicles(plate_number,brand,model)').in('id',ids).order('created_at',{ascending:false});
if(error){box.textContent='Gagal memuat data SPK: '+error.message;return}
let rows=(orders||[]).filter(x=>{let d=x.work_date||x.request_date||(x.created_at||'').slice(0,10);return (!from||d>=from)&&(!to||d<=to)});
let {data:mech}=await supabase.from('mechanics').select('name').eq('id',mid).maybeSingle();
box.innerHTML=`<h4>Riwayat: ${esc(mech?.name||'Mekanik')}</h4><p class="muted">Total SPK: ${rows.length}${from||to?' · Periode '+(from||'awal')+' sampai '+(to||'sekarang'):''}</p>`+(rows.length?`<div class="scroll"><table><thead><tr><th>No.</th><th>Nomor SPK</th><th>Tanggal</th><th>Nomor Polisi</th><th>Kendaraan</th><th>Jenis</th><th>Keluhan</th><th>Pekerjaan</th><th>Status SPK</th></tr></thead><tbody>${rows.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.spk_number)}</td><td>${esc(x.work_date||x.request_date||x.created_at?.slice(0,10))}</td><td>${esc(x.vehicles?.plate_number)}</td><td>${esc([x.vehicles?.brand,x.vehicles?.model].filter(Boolean).join(' '))}</td><td>${esc(x.work_type)}</td><td>${esc(x.complaint)}</td><td>${esc(x.repair_reason)}</td><td><span class="tag">${esc(x.result_status==='Dibuat'?'Pending':x.result_status||'Pending')}</span></td></tr>`).join('')}</tbody></table></div>`:'<p>Tidak ada SPK pada periode yang dipilih.</p>');
}




let vehiclesCountCache=null;
const pmTypes=[
 {key:'service_berkala',label:'Service berkala',months:1},
 {key:'filter_solar',label:'Filter solar',months:4},
 {key:'oli_mesin',label:'Ganti oli mesin',months:6},
 {key:'oli_transmisi',label:'Ganti oli transmisi',months:18},
 {key:'oli_gardan',label:'Ganti oli gardan',months:24}
];
function pmDateStatus(due){
 const today=new Date();today.setHours(0,0,0,0);
 const d=new Date(due+'T00:00:00');
 const days=Math.ceil((d-today)/86400000);
 if(days<0)return {label:'Terlambat '+Math.abs(days)+' hari',color:'#b42318'};
 if(days<=30)return {label:days===0?'Jatuh tempo hari ini':'Jatuh tempo '+days+' hari lagi',color:'#b54708'};
 return {label:'Terjadwal',color:'#067647'};
}
function addMonthsISO(dateStr,months){
 const d=new Date(dateStr+'T00:00:00');
 const day=d.getDate();
 d.setDate(1);d.setMonth(d.getMonth()+months);
 const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
 d.setDate(Math.min(day,last));
 return d.toISOString().slice(0,10);
}
async function pmPage(){
 const p=$('page');
 const roles=profile?.roles||[];
 const canManage=roles.includes('kepala_workshop');
 p.innerHTML=`<h3>Preventive Maintenance</h3>
 <p class="muted">Jadwal berlaku untuk seluruh armada. Tanggal terakhir perawatan dimasukkan manual oleh Kepala Workshop.</p>
 <div class="card"><h4>Standar Interval PM TDP</h4>
 <div class="scroll"><table><thead><tr><th>Jenis perawatan</th><th>Interval</th></tr></thead><tbody>
 ${pmTypes.map(x=>`<tr><td>${esc(x.label)}</td><td>${x.months} bulan</td></tr>`).join('')}
 </tbody></table></div></div>
 ${canManage?`<div class="card"><h4>Input / Perbarui Tanggal Terakhir PM</h4>
 <label>Pilih unit kendaraan</label><select id="pmVehicle"><option value="">Memuat unit...</option></select>
 <p class="muted">Isi tanggal terakhir yang diketahui. Kolom yang dikosongkan tidak akan mengubah jadwal yang sudah tersimpan.</p>
 <div class="grid">${pmTypes.map(x=>`<div class="field"><label>${esc(x.label)} · ${x.months} bulan</label><input type="date" id="pm-${x.key}"></div>`).join('')}</div>
 <label>Catatan (opsional)</label><textarea id="pmNotes" placeholder="Sumber tanggal, nomor dokumen, atau keterangan lainnya"></textarea>
 <button id="pmSave" type="button">Simpan Jadwal PM</button><p id="pmMsg" class="msg"></p>
 </div>`:`<p class="muted">Akun ini hanya dapat melihat jadwal PM.</p>`}
 <div class="card"><h4>Ringkasan Status PM Armada</h4><p class="muted">Status per unit mengikuti prioritas tertinggi: jika ada satu PM terlambat, unit dihitung terlambat; jika tidak ada yang terlambat tetapi ada PM jatuh tempo ≤ 30 hari, unit dihitung segera jatuh tempo.</p><div id="pmSummary" class="grid"><div class="tag">Memuat ringkasan...</div></div></div>
 <div class="card"><h4>Jadwal PM Seluruh Unit</h4><div class="grid"><div class="field"><label>Filter unit</label><select id="pmFilterVehicle"><option value="">Semua unit</option></select></div><div class="field"><label>Status</label><select id="pmFilterStatus"><option value="">Semua status</option><option value="late">Terlambat</option><option value="soon">Jatuh tempo ≤ 30 hari</option><option value="normal">Terjadwal</option></select></div></div><button id="pmRefresh" class="secondary" type="button">Tampilkan jadwal</button><div id="pmRows">Memuat jadwal...</div></div>`;
 const {data:vehicles,error}=await supabase.from('vehicles').select('id,plate_number,brand,model').order('plate_number');
 if(error){$('pmRows').textContent='Gagal memuat unit: '+error.message;return}
 vehiclesCountCache=(vehicles||[]).length;
 const opts=(vehicles||[]).map(v=>`<option value="${v.id}">${esc(v.plate_number)} — ${esc(v.brand)} ${esc(v.model)}</option>`).join('');
 if(canManage){
  $('pmVehicle').innerHTML='<option value="">Pilih unit</option>'+opts;
  $('pmVehicle').onchange=loadPmDatesForVehicle;
  $('pmSave').onclick=savePmSchedule;
 }
 $('pmFilterVehicle').innerHTML='<option value="">Semua unit</option>'+opts;
 $('pmRefresh').onclick=loadPmRows;
 $('pmFilterVehicle').onchange=loadPmRows;
 $('pmFilterStatus').onchange=loadPmRows;
 await loadPmRows();
}
async function loadPmDatesForVehicle(){
 const id=$('pmVehicle').value;
 pmTypes.forEach(x=>{const el=$('pm-'+x.key);if(el)el.value=''});
 $('pmNotes').value='';
 if(!id)return;
 const {data,error}=await supabase.from('pm_schedules').select('pm_type,last_service_date,notes').eq('vehicle_id',id);
 if(error){$('pmMsg').textContent='Gagal membaca jadwal PM: '+error.message;return}
 for(const row of data||[]){
  const el=$('pm-'+row.pm_type);if(el)el.value=row.last_service_date||'';
  if(row.notes)$('pmNotes').value=row.notes;
 }
}
async function savePmSchedule(){
 const id=$('pmVehicle').value,btn=$('pmSave'),msg=$('pmMsg');
 if(!id){msg.textContent='Pilih unit kendaraan terlebih dahulu.';return}
 const entries=pmTypes.map(x=>({type:x,date:$('pm-'+x.key).value})).filter(x=>x.date);
 if(!entries.length){msg.textContent='Isi minimal satu tanggal terakhir perawatan.';return}
 btn.disabled=true;btn.textContent='Menyimpan...';msg.textContent='';
 const notes=$('pmNotes').value.trim()||null;
 for(const entry of entries){
  const {error}=await supabase.from('pm_schedules').upsert({
   vehicle_id:id,pm_type:entry.type.key,last_service_date:entry.date,notes
  },{onConflict:'vehicle_id,pm_type'});
  if(error){
   msg.textContent='Gagal menyimpan '+entry.type.label+': '+error.message;
   btn.disabled=false;btn.textContent='Simpan Jadwal PM';return;
  }
 }
 msg.className='msg success';
 msg.textContent=`Berhasil menyimpan ${entries.length} jadwal PM. Tanggal jatuh tempo dihitung otomatis.`;
 btn.disabled=false;btn.textContent='Simpan Jadwal PM';
 await loadPmRows();
}
async function loadPmRows(){
 const box=$('pmRows');if(!box)return;
 box.textContent='Memuat jadwal PM...';
 let q=supabase.from('pm_schedules').select('id,vehicle_id,pm_type,interval_months,last_service_date,next_due_date,notes,vehicles(plate_number,brand,model)').order('next_due_date');
 const vehicle=$('pmFilterVehicle')?.value,status=$('pmFilterStatus')?.value;
 if(vehicle)q=q.eq('vehicle_id',vehicle);
 const {data,error}=await q.limit(2000);
 if(error){box.textContent='Gagal memuat jadwal PM: '+error.message;return}
 const allRows=(data||[]).map(x=>({...x,_status:pmDateStatus(x.next_due_date)}));
 // Ringkasan dihitung per kendaraan, bukan per baris PM, agar satu unit tidak dihitung berulang.
 const byVehicle=new Map();
 for(const x of allRows){
  if(!byVehicle.has(x.vehicle_id))byVehicle.set(x.vehicle_id,{vehicle_id:x.vehicle_id,plate:x.vehicles?.plate_number,states:[]});
  byVehicle.get(x.vehicle_id).states.push(x._status);
 }
 const summary={late:0,soon:0,normal:0};
 for(const unit of byVehicle.values()){
  if(unit.states.some(x=>x.label.startsWith('Terlambat')))summary.late++;

 $('crSummary').innerHTML=[

 ].map(([a,b])=>`<div class="card"><div class="muted">${esc(a)}</div><div style="font-size:22px;font-weight:bold;margin-top:8px">${esc(b)}</div></div>`).join('');

 const byCategory={};

 const catRows=Object.entries(byCategory).sort((a,b)=>b[1]-a[1]);

}

$('worktype').onchange=()=>{$('spkPmPanel').classList.toggle('hidden',$('worktype').value!=='Preventive Maintenance')};
$('worktype').onchange();
$('saveSpk').onclick=async()=>{let btn=$('saveSpk');if(!$('vehicle').value||!$('complaint').value.trim())return say('spkmsg','Pilih unit dan isi keluhan terlebih dahulu.');btn.disabled=true;btn.textContent='Menyimpan...';let selected=[...document.querySelectorAll('.mechanic-check:checked')].map(x=>x.value);let selectedPm=[...document.querySelectorAll('.spk-pm-check:checked')].map(x=>x.value);if($('worktype').value==='Preventive Maintenance'&&!selectedPm.length){btn.disabled=false;btn.textContent='Simpan SPK';return say('spkmsg','Pilih minimal satu jenis PM.')}let payload={spk_number:$('spkno').value,vehicle_id:$('vehicle').value,driver_name:$('driver').value.trim()||null,complaint:$('complaint').value.trim(),repair_reason:$('reason').value.trim()||null,pic_name:$('pic').value.trim()||null,mechanic_id:null,work_type:$('worktype').value,request_date:$('reqdate').value||null,work_date:$('workdate').value||null,result_status:'Pending'};let {data:created,error}=await supabase.from('work_orders').insert(payload).select('id').single();if(error){btn.disabled=false;btn.textContent='Simpan SPK';say('spkmsg','SPK gagal disimpan: '+error.message);return}
if(selected.length){let taskRows=selected.map(mid=>({work_order_id:created.id,task_description:'Pekerjaan mekanik pada SPK '+payload.spk_number}));let {data:tasks,error:taskError}=await supabase.from('work_order_tasks').insert(taskRows).select('id');if(taskError){btn.disabled=false;btn.textContent='Simpan SPK';say('spkmsg','SPK tersimpan, tetapi tugas mekanik gagal dibuat: '+taskError.message);return}
let assignments=selected.map((mid,i)=>({work_order_id:created.id,task_id:tasks[i].id,mechanic_id:mid,status:'Ditugaskan'}));let {error:assignError}=await supabase.from('work_order_assignments').insert(assignments);if(assignError){btn.disabled=false;btn.textContent='Simpan SPK';say('spkmsg','SPK tersimpan, tetapi penugasan mekanik gagal: '+assignError.message);return}}
if(selectedPm.length){const {error:pmError}=await supabase.from('work_order_pm_items').insert(selectedPm.map(pm_type=>({work_order_id:created.id,pm_type,status:'Belum Dikerjakan'})));if(pmError){btn.disabled=false;btn.textContent='Simpan SPK';return say('spkmsg','SPK sudah tersimpan, tetapi daftar PM gagal disimpan: '+pmError.message+' — Jangan buat SPK ulang; periksa SPK ini.')}}
btn.disabled=false;btn.textContent='Simpan SPK';say('spkmsg','SPK berhasil disimpan: '+payload.spk_number+' | Mekanik ditugaskan: '+selected.length,true);$('spkno').value=makeNo();$('driver').value='';$('pic').value='';$('complaint').value='';$('reason').value='';document.querySelectorAll('.mechanic-check').forEach(x=>x.checked=false);document.querySelectorAll('.spk-pm-check').forEach(x=>x.checked=false);await loadSpkList()};
await loadSpkList()}
async function loadSpkList(){
 let box=$('spkrows');
 let {data,error}=await supabase.from('work_orders').select('id,spk_number,work_date,work_type,result_status,complaint,vehicle_id,vehicles(plate_number)').order('created_at',{ascending:false}).limit(50);
 if(error){box.textContent='Gagal memuat daftar SPK: '+error.message;return}
 if(!data.length){box.textContent='Belum ada SPK. Silakan buat SPK pertama.';return}
 box.innerHTML='<div class="scroll"><table><thead><tr><th>Nomor SPK</th><th>Status SPK</th><th>Unit</th><th>Tanggal</th><th>Jenis</th><th>Keluhan</th><th>Aksi</th></tr></thead><tbody>'+
 data.map(x=>{
  let st=x.result_status||'Pending';if(st==='Dibuat')st='Pending';
  let isDone=st==='Selesai';
  return `<tr><td>${esc(x.spk_number)}</td><td><span class="tag">${esc(st)}</span></td><td>${esc(x.vehicles?.plate_number)}</td><td>${esc(x.work_date)}</td><td>${esc(x.work_type)}</td><td>${esc(x.complaint)}</td><td>${isDone?`<button type="button" class="secondary" style="width:auto;white-space:nowrap" onclick="window.viewSpkCosts('${x.id}','${esc(x.spk_number)}')">Lihat biaya</button>`:`<select id="status-${x.id}" style="min-width:160px"><option value="Pending" ${st==='Pending'?'selected':''}>Pending</option><option value="Sedang Dikerjakan" ${st==='Sedang Dikerjakan'?'selected':''}>Sedang Dikerjakan</option></select><button type="button" style="width:auto;white-space:nowrap" onclick="window.updateSpkStatus('${x.id}')">Simpan status</button><button type="button" style="width:auto;white-space:nowrap" onclick="window.openCloseSpk('${x.id}','${esc(x.spk_number)}','${x.vehicle_id}')">Tutup SPK</button>`}</td></tr>`;
 }).join('')+'</tbody></table></div><div id="spkClosePanel"></div>';
}
window.updateSpkStatus=async(id)=>{
 let status=document.getElementById('status-'+id)?.value;if(!status)return;
 let {data,error}=await supabase.from('work_orders').update({result_status:status}).eq('id',id).select('id,result_status').single();
 if(error){alert('Status gagal diperbarui: '+error.message);return}
 alert('Berhasil. Status SPK sekarang: '+data.result_status);await loadSpkList()
};
window.openCloseSpk=(id,spkNo,vehicleId)=>{
 if(!(profile?.roles||[]).includes('kepala_workshop')){alert('Hanya Kepala Workshop yang dapat menutup SPK.');return}
 const panel=$('spkClosePanel');
 panel.innerHTML=`<div class="card" style="margin-top:16px"><h4>Penutupan SPK: ${esc(spkNo)}</h4><p class="muted">Rincian biaya boleh dikosongkan jika pekerjaan tidak mengeluarkan biaya. Jika ada biaya, isi setiap item secara terpisah.</p><div id="closeCostRows"></div><div class="actions"><button type="button" class="secondary" onclick="window.addCloseCostRow()">+ Tambah item biaya</button></div><div id="closePmPanel" class="card hidden" style="background:#f7fbff"><h4>Konfirmasi pekerjaan PM</h4><p class="muted">Centang hanya pekerjaan yang benar-benar selesai. Yang tidak dicentang tidak memperbarui jadwal PM.</p><div id="closePmChoices"></div></div><label>Catatan penutupan (opsional)</label><textarea id="closeNotes" placeholder="Catatan hasil pekerjaan"></textarea><div class="actions"><button type="button" id="confirmCloseSpk">Tutup SPK</button><button type="button" id="cancelCloseSpk" class="secondary">Batal</button></div><p id="closeMsg" class="msg"></p></div>`;
 window.closeSpkContext={id,spkNo,vehicleId};
 supabase.from('work_order_pm_items').select('id,pm_type,status,pm_applied_at').eq('work_order_id',id).then(({data,error})=>{const panel=$('closePmPanel'),box=$('closePmChoices');if(!panel||!box)return;if(error){panel.classList.remove('hidden');box.textContent='Gagal membaca pekerjaan PM: '+error.message;window.closeSpkContext.pmLoadError=true;return}window.closeSpkContext.pmItems=data||[];if(!data?.length)return;panel.classList.remove('hidden');box.innerHTML=data.map(x=>{const t=pmTypes.find(t=>t.key===x.pm_type);return `<label style="display:flex;gap:8px;align-items:center;margin:8px 0"><input class="close-pm-check" type="checkbox" value="${x.id}" style="width:auto" ${x.status==='Selesai'?'checked':''} ${x.pm_applied_at?'disabled':''}>${esc(t?.label||x.pm_type)} ${x.pm_applied_at?'(sudah diterapkan)':''}</label>`}).join('')});
 window.addCloseCostRow();
 $('confirmCloseSpk').onclick=window.confirmCloseSpk;
 $('cancelCloseSpk').onclick=()=>{$('spkClosePanel').innerHTML=''};
};
window.addCloseCostRow=()=>{
 const box=$('closeCostRows');if(!box)return;
 const n=box.children.length+1;
 const row=document.createElement('div');row.className='card close-cost-row';row.style='padding:12px;margin:8px 0';
 row.innerHTML=`<div class="grid"><div class="field"><label>Kategori biaya</label><select class="cost-category"><option>Sparepart</option><option>Oli dan pelumas</option><option>Ban</option><option>Jasa vendor</option><option>Bahan habis pakai</option><option>Lainnya</option></select></div><div class="field"><label>Nama item / keterangan</label><input class="cost-item" placeholder="Contoh: Filter solar"></div><div class="field"><label>Jumlah</label><input class="cost-qty" type="number" min="0.01" step="0.01" value="1"></div><div class="field"><label>Harga satuan (Rp)</label><input class="cost-price" type="number" min="0" step="1" placeholder="0"></div><div class="field"><label>Vendor (opsional)</label><input class="cost-vendor" placeholder="Nama toko/vendor"></div></div><button type="button" class="secondary remove-cost" style="width:auto">Hapus item</button>`;
 row.querySelector('.remove-cost').onclick=()=>row.remove();box.appendChild(row);
};
window.confirmCloseSpk=async()=>{
 const ctx=window.closeSpkContext;if(!ctx)return;
 const btn=$('confirmCloseSpk'),msg=$('closeMsg');btn.disabled=true;btn.textContent='Memproses...';msg.textContent='';
 if(ctx.pmLoadError||!Array.isArray(ctx.pmItems)){msg.textContent='Daftar pekerjaan PM belum berhasil dimuat. Tunggu atau buka kembali panel penutupan.';btn.disabled=false;btn.textContent='Tutup SPK';return}
 const pmItems=ctx.pmItems.filter(x=>!x.pm_applied_at);const pmDone=new Set([...document.querySelectorAll('.close-pm-check:checked')].map(x=>x.value));
 if(pmItems.length){for(const item of pmItems){const {error:pmError}=await supabase.from('work_order_pm_items').update({status:pmDone.has(item.id)?'Selesai':'Tidak Dikerjakan',service_date:pmDone.has(item.id)?null:null,completed_at:pmDone.has(item.id)?new Date().toISOString():null}).eq('id',item.id);if(pmError){msg.textContent='Gagal mengonfirmasi pekerjaan PM: '+pmError.message;btn.disabled=false;btn.textContent='Tutup SPK';return}}}
 const rows=[...document.querySelectorAll('.close-cost-row')];
 const costs=[];
 for(const r of rows){
  const item=r.querySelector('.cost-item').value.trim();
  const qty=Number(r.querySelector('.cost-qty').value);
  const price=Number(r.querySelector('.cost-price').value);
  const any=item||r.querySelector('.cost-price').value||r.querySelector('.cost-vendor').value.trim();
  if(!any)continue;
  if(!item||!Number.isFinite(qty)||qty<=0||!Number.isFinite(price)||price<0){msg.textContent='Lengkapi nama item, jumlah, dan harga satuan dengan benar.';btn.disabled=false;btn.textContent='Tutup SPK';return}
  costs.push({work_order_id:ctx.id,vehicle_id:ctx.vehicleId,transaction_date:new Date().toISOString().slice(0,10),category:r.querySelector('.cost-category').value,item_name:item,quantity:qty,unit_price:price,vendor:r.querySelector('.cost-vendor').value.trim()||null});
 }
 if(costs.length){
  const {error:costError}=await supabase.from('work_order_costs').insert(costs);
  if(costError){msg.textContent='Biaya gagal disimpan. SPK belum ditutup. '+costError.message;btn.disabled=false;btn.textContent='Tutup SPK';return}
 }
 const {error}=await supabase.from('work_orders').update({result_status:'Selesai',result_notes:$('closeNotes').value.trim()||null}).eq('id',ctx.id);
 if(error){msg.textContent='Biaya tersimpan sebagai Draft, tetapi status SPK gagal ditutup: '+error.message;btn.disabled=false;btn.textContent='Tutup SPK';return}
 msg.className='msg success';msg.textContent=costs.length?`SPK berhasil ditutup. ${costs.length} item biaya tersimpan dengan status Draft. Persetujuan biaya dilakukan setelah ini.`:'SPK berhasil ditutup tanpa biaya.';
 btn.textContent='Selesai';await loadSpkList();
};
window.viewSpkCosts=async(id,spkNo)=>{
 const panel=$('spkClosePanel');panel.innerHTML=`<div class="card" style="margin-top:16px"><h4>Biaya SPK: ${esc(spkNo)}</h4><div id="costViewRows">Memuat biaya...</div><button type="button" class="secondary" id="closeCostView">Tutup</button></div>`;
 $('closeCostView').onclick=()=>{$('spkClosePanel').innerHTML=''};
 const {data,error}=await supabase.from('work_order_costs').select('id,category,item_name,quantity,unit_price,total_amount,vendor,approval_status,approval_notes').eq('work_order_id',id).order('created_at');
 const box=$('costViewRows');if(error){box.textContent='Gagal memuat biaya: '+error.message;return}
 if(!data?.length){box.textContent='SPK ini tidak memiliki rincian biaya.';return}
 const rupiah=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n||0));
 box.innerHTML='<div class="scroll"><table><thead><tr><th>Item</th><th>Jumlah</th><th>Harga</th><th>Total</th><th>Status biaya</th></tr></thead><tbody>'+data.map(c=>`<tr><td>${esc(c.item_name)}<br><small>${esc(c.category)} · ${esc(c.vendor||'-')}</small></td><td>${esc(c.quantity)}</td><td>${rupiah(c.unit_price)}</td><td>${rupiah(c.total_amount)}</td><td>${esc(c.approval_status)}</td></tr>`).join('')+'</tbody></table></div><p><b>Total: ${rupiah(data.reduce((a,c)=>a+Number(c.total_amount||0),0))}</b></p>';
 if((profile?.roles||[]).includes('kepala_workshop')&&data.some(c=>c.approval_status==='draft')){
  box.innerHTML+=`<label>Catatan persetujuan (opsional)</label><textarea id="costApprovalNotes" placeholder="Catatan pemeriksaan biaya"></textarea><button type="button" id="approveCostsBtn">Setujui biaya Draft</button><p id="approveCostsMsg" class="msg"></p>`;
  $('approveCostsBtn').onclick=async()=>{const b=$('approveCostsBtn');b.disabled=true;b.textContent='Menyetujui...';const drafts=data.filter(c=>c.approval_status==='draft');for(const c of drafts){const {error:uerr}=await supabase.from('work_order_costs').update({approval_status:'approved',approval_notes:$('costApprovalNotes').value.trim()||null}).eq('id',c.id);if(uerr){$('approveCostsMsg').textContent='Persetujuan gagal: '+uerr.message;b.disabled=false;b.textContent='Setujui biaya Draft';return}}$('approveCostsMsg').className='msg success';$('approveCostsMsg').textContent='Semua biaya Draft berhasil disetujui.';await window.viewSpkCosts(id,spkNo)};
 }
};
init();
</script></body></html>
