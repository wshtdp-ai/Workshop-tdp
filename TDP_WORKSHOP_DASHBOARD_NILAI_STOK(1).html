<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12345a"><link rel="manifest" href="manifest.webmanifest"><title>Workshop TDP - Status SPK</title>
<style>
:root{font-family:Arial,sans-serif;color:#172334;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#12345a;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:20px;margin:0}main{max-width:1100px;margin:22px auto;padding:0 14px}.card{background:#fff;border:1px solid #dce3eb;border-radius:12px;padding:18px;margin-bottom:16px}input,select,textarea,button{font:inherit;padding:11px;border-radius:8px;border:1px solid #cbd5e1;width:100%;margin:5px 0}textarea{min-height:80px}button{background:#12345a;color:#fff;border:0;font-weight:bold;cursor:pointer}button.secondary{background:#e7edf5;color:#12345a}.hidden{display:none}.muted{color:#64748b;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}nav button{width:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:left;vertical-align:top}th{background:#eaf0f7}.scroll{overflow-x:auto}.msg{white-space:pre-wrap;font-size:13px;color:#b42318}.success{color:#067647}.field{display:flex;flex-direction:column}.actions{display:flex;gap:8px}.actions button{width:auto}.tag{display:inline-block;background:#e7edf5;padding:4px 8px;border-radius:20px;font-size:12px}
</style></head><body>
<header><div><h1>Workshop PT TRANS DAYA PRIMA</h1><small>Manajemen unit · SPK · Preventive Maintenance</small></div><button id="logout" class="secondary hidden" style="width:auto">Keluar</button></header>
<main>
<section id="setup" class="card"><h2>Pengaturan koneksi Supabase</h2><p class="muted">Gunakan Project URL dan publishable key. Jangan gunakan service_role key.</p><label>Project URL</label><input id="url" placeholder="https://xxxx.supabase.co"><label>Anon / Publishable key</label><input id="key" placeholder="Supabase publishable key"><button id="saveConfig">Simpan koneksi</button><p id="setupStatus" class="muted"></p></section>
<section id="login" class="card hidden"><h2>Masuk Workshop TDP</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Masuk</button><p id="loginStatus" class="msg"></p></section>
<section id="app" class="hidden"><div class="card"><h2 id="welcome">Dashboard</h2><p id="role" class="muted"></p><nav><button data-page="dashboard">Dashboard</button><button data-page="vehicles">Master Unit</button><button data-page="trailers">Master Trailer</button><button data-page="spk">SPK</button><button data-page="mechanic-history">Riwayat SPK Mekanik</button><button data-page="pm">Preventive Maintenance</button><button data-page="downtime">Downtime Kendaraan</button><button data-page="cost-report">Laporan Biaya</button><button data-page="monthly-report">Laporan Bulanan</button><button data-page="damage-analysis">Analisis Jenis Kerusakan</button><button data-page="inventory">Stok Sparepart</button></nav><div id="page"></div></div></section>
</main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const $=id=>document.getElementById(id);let supabase=null,profile=null;
const esc=v=>String(v??'-').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function say(id,msg,ok=false){$(id).textContent=msg;$(id).className=ok?'msg success':'msg'}
function init(){let u=localStorage.getItem('tdp_supabase_url'),k=localStorage.getItem('tdp_supabase_key');if(u&&k){$('url').value=u;$('key').value=k;supabase=createClient(u,k);$('setup').classList.add('hidden');$('login').classList.remove('hidden')}}
$('saveConfig').onclick=()=>{let u=$('url').value.trim(),k=$('key').value.trim();if(!u.startsWith('https://')||!k)return say('setupStatus','Periksa Project URL dan publishable key.');localStorage.setItem('tdp_supabase_url',u);localStorage.setItem('tdp_supabase_key',k);supabase=createClient(u,k);$('setup').classList.add('hidden');$('login').classList.remove('hidden')};
$('loginBtn').onclick=async()=>{say('loginStatus','Memeriksa akun...');let {data,error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return say('loginStatus',error.message);let p=await supabase.from('profiles').select('full_name,roles').eq('id',data.user.id).single();if(p.error)return say('loginStatus','Profil belum terbaca: '+p.error.message);profile=p.data;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');$('welcome').textContent='Selamat datang, '+(profile.full_name||'Pengguna');$('role').textContent='Hak akses: '+(profile.roles||[]).join(', ');show('dashboard')};
$('logout').onclick=async()=>{await supabase.auth.signOut();location.reload()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.page));
async function show(name){let p=$('page');if(name==='dashboard'){await dashboardPage();return}
if(name==='vehicles'){p.innerHTML='<h3>Master Unit</h3><div id="vrows" class="muted">Memuat data...</div>';let {data,error}=await supabase.from('vehicles').select('*').order('plate_number').limit(200);if(error)return $('vrows').textContent=error.message;if(!data.length)return $('vrows').textContent='Belum ada data unit.';$('vrows').innerHTML=`<p class="muted">Jumlah unit: ${data.length}</p><div class="scroll"><table><thead><tr><th>No.</th><th>Nomor Polisi</th><th>Merek</th><th>Jenis</th><th>Model</th><th>Tahun</th><th>Status</th><th>Riwayat</th></tr></thead><tbody>${data.map((v,i)=>`<tr><td>${i+1}</td><td>${esc(v.plate_number)}</td><td>${esc(v.brand)}</td><td>${esc(v.vehicle_type)}</td><td>${esc(v.model)}</td><td>${esc(v.year)}</td><td>${esc(v.status)}</td><td><button type="button" style="width:auto" onclick="window.showVehicleHistory('${v.id}')">Lihat riwayat</button></td></tr>`).join('')}</tbody></table></div>`;return}
if(name==='trailers'){await trailerPage();return}
 if(name==='spk'){await spkPage();return}
if(name==='mechanic-history'){await mechanicHistoryPage();return}
if(name==='downtime'){await downtimePage();return}
 if(name==='cost-report'){await costReportPage();return}
if(name==='monthly-report'){await monthlyReportPage();return}
if(name==='damage-analysis'){await damageAnalysisPage();return}
if(name==='inventory'){await inventoryPage();return}
 if(name==='pm'){await pmPage();return}
p.innerHTML='<h3>Preventive Maintenance</h3><p>Modul PM akan diaktifkan setelah formulir SPK selesai diuji.</p>'}


async function trailerPage(){
 const p=$('page');
 p.innerHTML='<h3>Master Trailer</h3><p class="muted">Daftar aset Trailer terpisah dari Master Unit Tractor Head. Riwayat pekerjaan melekat pada kode Trailer, bukan pasangan Tractor Head.</p><div id="trailerRows" class="muted">Memuat data Trailer...</div>';
 const {data,error}=await supabase.from('trailers').select('id,trailer_code,status,notes').order('trailer_code');
 if(error){$('trailerRows').textContent='Gagal memuat Master Trailer: '+error.message;return}
 const rows=data||[];
 $('trailerRows').innerHTML='<p><b>Jumlah Trailer: '+rows.length+'</b></p><div class="scroll"><table><thead><tr><th>No.</th><th>Kode Trailer</th><th>Status</th><th>Riwayat</th></tr></thead><tbody>'+rows.map((t,i)=>`<tr><td>${i+1}</td><td><b>${esc(t.trailer_code)}</b></td><td>${esc(t.status)}</td><td><button type="button" style="width:auto" onclick="window.showTrailerHistory('${t.id}')">Lihat riwayat</button></td></tr>`).join('')+'</tbody></table></div>';
}
window.showTrailerHistory=async(trailerId)=>{
 const box=$('trailerRows');box.innerHTML='<p class="muted">Memuat riwayat Trailer...</p>';
 const {data:trailer,error:tErr}=await supabase.from('trailers').select('trailer_code,status').eq('id',trailerId).single();
 if(tErr){box.textContent='Gagal membaca Trailer: '+tErr.message;return}
 const {data:orders,error}=await supabase.from('work_orders').select('id,spk_number,request_date,work_date,work_type,complaint,repair_reason,result_status,driver_name,pic_name,created_at').eq('trailer_id',trailerId).order('created_at',{ascending:false});
 if(error){box.textContent='Gagal memuat riwayat Trailer: '+error.message;return}
 const rows=orders||[];
 box.innerHTML=`<div class="actions"><button type="button" class="secondary" onclick="show('trailers')">Kembali ke Master Trailer</button></div><h3>Riwayat Trailer: ${esc(trailer.trailer_code)}</h3><p class="muted">Total riwayat SPK: ${rows.length}</p>`+(rows.length?'<div class="scroll"><table><thead><tr><th>Nomor SPK</th><th>Tanggal</th><th>Jenis</th><th>Keluhan</th><th>Pekerjaan</th><th>Sopir</th><th>PIC</th><th>Status</th></tr></thead><tbody>'+rows.map(x=>`<tr><td>${esc(x.spk_number)}</td><td>${esc(x.work_date||x.request_date||x.created_at?.slice(0,10))}</td><td>${esc(x.work_type)}</td><td>${esc(x.complaint)}</td><td>${esc(x.repair_reason)}</td><td>${esc(x.driver_name)}</td><td>${esc(x.pic_name)}</td><td>${esc(x.result_status||'Pending')}</td></tr>`).join('')+'</tbody></table></div>':'<p>Belum ada riwayat SPK untuk Trailer ini.</p>');
};

window.showVehicleHistory=async(vehicleId)=>{
let box=$('vrows');box.innerHTML='<p class="muted">Memuat riwayat kendaraan...</p>';
let {data:vehicle,error:vError}=await supabase.from('vehicles').select('plate_number,brand,model').eq('id',vehicleId).single();
if(vError){box.textContent='Gagal memuat kendaraan: '+vError.message;return}
let {data:orders,error}=await supabase.from('work_orders').select('id,spk_number,request_date,work_date,work_type,complaint,repair_reason,result_status,driver_name,pic_name,created_at').eq('vehicle_id',vehicleId).order('created_at',{ascending:false});
if(error){box.textContent='Gagal memuat riwayat SPK: '+error.message;return}
let title=`Riwayat Kendaraan: ${esc(vehicle.plate_number)} — ${esc(vehicle.brand)} ${esc(vehicle.model)}`;
let rows=orders||[];
let assignmentMap={};
if(rows.length){
let ids=rows.map(x=>x.id).filter(Boolean);
let {data:assignments,error:assignmentError}=await supabase.from('work_order_assignments').select('work_order_id,status,mechanics(name)').in('work_order_id',ids);
if(!assignmentError){for(let a of (assignments||[])){let n=a.mechanics?.name||'Nama mekanik tidak tersedia';let st=a.status||'Ditugaskan';(assignmentMap[a.work_order_id]??=[]).push(n+' ('+st+')')}}
}
box.innerHTML=`<div class="actions"><button type="button" class="secondary" onclick="show('vehicles')">Kembali ke Master Unit</button></div><h3>${title}</h3><p class="muted">Total riwayat SPK: ${rows.length}</p>`+(rows.length?`<div class="scroll"><table><thead><tr><th>Nomor SPK</th><th>Tanggal</th><th>Jenis</th><th>Keluhan</th><th>Pekerjaan</th><th>Mekanik yang mengerjakan</th><th>Sopir</th><th>PIC</th><th>Status SPK</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.spk_number)}</td><td>${esc(x.work_date||x.request_date||x.created_at?.slice(0,10))}</td><td>${esc(x.work_type)}</td><td>${esc(x.complaint)}</td><td>${esc(x.repair_reason)}</td><td>${esc((assignmentMap[x.id]||[]).join(', ')||'Belum ada penugasan mekanik')}</td><td>${esc(x.driver_name)}</td><td>${esc(x.pic_name)}</td><td><span class="tag">${esc(x.result_status==='Dibuat'?'Pending':x.result_status||'Pending')}</span></td></tr>`).join('')}</tbody></table></div>`:'<p>Belum ada riwayat SPK untuk kendaraan ini.</p>');
};


async function inventoryPage(){
 const p=$('page');
 p.innerHTML=`<h3>Manajemen Stok Sparepart</h3>
 <p class="muted">Master barang, stok masuk, stok keluar, harga modal rata-rata, dan riwayat transaksi.</p>
 <div class="card"><h4>Ringkasan Nilai Persediaan</h4><div id="invSummary" class="grid"><p class="muted">Menghitung nilai stok...</p></div><div id="invCategorySummary" style="margin-top:14px"></div><div id="invTopValue" style="margin-top:14px"></div></div>
 <div class="card"><h4>Tambah Master Sparepart</h4><div class="grid">
 <div class="field"><label>Kode sparepart</label><input id="invCode" placeholder="Contoh: SP001"></div>
 <div class="field"><label>Nama sparepart</label><input id="invName" placeholder="Nama barang"></div>
 <div class="field"><label>Kategori</label><input id="invCategory" placeholder="Filter / Oli / Rem"></div>
 <div class="field"><label>Satuan</label><input id="invUnit" placeholder="Pcs / Botol / Set"></div>
 <div class="field"><label>Harga beli awal (Rp)</label><input id="invPrice" type="number" min="0" value="0"></div>
 <div class="field"><label>Stok awal</label><input id="invOpening" type="number" min="0" step="0.01" value="0"></div>
 <div class="field"><label>Stok minimum</label><input id="invMinimum" type="number" min="0" step="0.01" value="0"></div>
 </div><button id="invAdd">Simpan Sparepart</button><p id="invMasterMsg" class="msg"></p></div>
 <div class="card"><h4>Transaksi Stok Masuk</h4><div class="grid">
 <div class="field"><label>Sparepart</label><select id="invInPart"><option value="">Pilih sparepart</option></select></div>
 <div class="field"><label>Jumlah masuk</label><input id="invInQty" type="number" min="0.01" step="0.01" value="1"></div>
 <div class="field"><label>Harga beli per satuan (Rp)</label><input id="invInPrice" type="number" min="0" value="0"></div>
 <div class="field"><label>Supplier</label><input id="invInSupplier" placeholder="Nama toko / supplier"></div>
 <div class="field"><label>Tanggal masuk</label><input id="invInDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
 </div><button id="invReceive">Catat Stok Masuk</button><p id="invInMsg" class="msg"></p></div>
 <div class="card"><h4>Daftar Stok</h4><div id="invRows" class="muted">Memuat...</div></div>
 <div class="card"><h4>Riwayat Transaksi</h4><div id="invHistory" class="muted">Memuat...</div></div>`;
 const {data,error}=await supabase.from('spareparts').select('*').order('part_name');
 if(error){$('invRows').textContent='Tabel stok belum tersedia. Jalankan SQL setup yang disertakan. Detail: '+error.message;return}
 const rows=data||[];
 $('invInPart').innerHTML='<option value="">Pilih sparepart</option>'+rows.map(x=>`<option value="${x.id}">${esc(x.part_code)} — ${esc(x.part_name)} (stok ${Number(x.stock_on_hand||0)})</option>`).join('');
 const money=n=>'Rp '+Number(n||0).toLocaleString('id-ID',{maximumFractionDigits:2});
 const totalValue=rows.reduce((sum,x)=>sum+Number(x.stock_on_hand||0)*Number(x.avg_unit_cost||0),0);
 const totalQty=rows.reduce((sum,x)=>sum+Number(x.stock_on_hand||0),0);
 const lowStock=rows.filter(x=>x.is_active!==false&&Number(x.stock_on_hand||0)<=Number(x.minimum_stock||0)).length;
 const activeCount=rows.filter(x=>x.is_active!==false).length;
 const summaryCard=(label,value)=>`<div style="background:#f3f6fa;border:1px solid #dce3eb;border-radius:10px;padding:15px"><div class="muted">${label}</div><div style="font-size:22px;font-weight:bold;margin-top:8px;overflow-wrap:anywhere">${value}</div></div>`;
 $('invSummary').innerHTML=summaryCard('TOTAL NILAI PERSEDIAAN',money(totalValue))+summaryCard('Jenis sparepart aktif',activeCount.toLocaleString('id-ID'))+summaryCard('Total kuantitas stok',totalQty.toLocaleString('id-ID',{maximumFractionDigits:2}))+summaryCard('Jenis stok menipis',lowStock.toLocaleString('id-ID'));
 const categories=new Map();
 for(const x of rows){const category=(x.category||'Tanpa kategori').trim()||'Tanpa kategori';const old=categories.get(category)||{types:0,value:0};old.types++;old.value+=Number(x.stock_on_hand||0)*Number(x.avg_unit_cost||0);categories.set(category,old)}
 const sortedCategories=[...categories].sort((a,b)=>b[1].value-a[1].value);
 $('invCategorySummary').innerHTML='<h4>Nilai Persediaan per Kategori</h4>'+(sortedCategories.length?'<div class="scroll"><table><thead><tr><th>Kategori</th><th>Jenis Part</th><th>Nilai Persediaan</th></tr></thead><tbody>'+sortedCategories.map(([name,v])=>`<tr><td>${esc(name)}</td><td>${v.types}</td><td>${money(v.value)}</td></tr>`).join('')+'</tbody></table></div>':'Belum ada sparepart.');
 const topValue=[...rows].sort((a,b)=>(Number(b.stock_on_hand||0)*Number(b.avg_unit_cost||0))-(Number(a.stock_on_hand||0)*Number(a.avg_unit_cost||0))).slice(0,10);
 $('invTopValue').innerHTML='<h4>10 Sparepart dengan Nilai Stok Terbesar</h4>'+(topValue.length?'<div class="scroll"><table><thead><tr><th>Kode</th><th>Nama</th><th>Stok</th><th>Harga Modal</th><th>Nilai</th></tr></thead><tbody>'+topValue.map(x=>`<tr><td>${esc(x.part_code)}</td><td>${esc(x.part_name)}</td><td>${Number(x.stock_on_hand||0)} ${esc(x.unit)}</td><td>${money(x.avg_unit_cost)}</td><td>${money(Number(x.stock_on_hand||0)*Number(x.avg_unit_cost||0))}</td></tr>`).join('')+'</tbody></table></div>':'Belum ada sparepart.');
 $('invRows').innerHTML=rows.length?'<div class="scroll"><table><thead><tr><th>Kode</th><th>Nama</th><th>Kategori</th><th>Satuan</th><th>Stok</th><th>Harga modal rata-rata</th><th>Nilai stok</th><th>Minimum</th><th>Status</th><th>Aksi</th></tr></thead><tbody>'+rows.map(x=>`<tr><td>${esc(x.part_code)}</td><td>${esc(x.part_name)}</td><td>${esc(x.category)}</td><td>${esc(x.unit)}</td><td>${Number(x.stock_on_hand||0)}</td><td>${money(x.avg_unit_cost)}</td><td>${money(Number(x.stock_on_hand||0)*Number(x.avg_unit_cost||0))}</td><td>${Number(x.minimum_stock||0)}</td><td>${Number(x.stock_on_hand||0)<=Number(x.minimum_stock||0)?'<span class="tag">Stok menipis</span>':'Aman'}</td><td><button type="button" class="secondary" style="width:auto" data-edit-sparepart="${x.id}">Edit</button></td></tr>`).join('')+'</tbody></table></div>':'Belum ada master sparepart.';
 $('invRows').insertAdjacentHTML('afterend','<div id="editSparepartPanel"></div>');
 $('invRows').querySelectorAll('[data-edit-sparepart]').forEach(btn=>btn.addEventListener('click',()=>window.editSparepart(btn.dataset.editSparepart)));
 $('invAdd').onclick=async()=>{
  const b=$('invAdd'),code=$('invCode').value.trim(),name=$('invName').value.trim(),price=Number($('invPrice').value),opening=Number($('invOpening').value),minimum=Number($('invMinimum').value);
  if(!code||!name||!$('invUnit').value.trim()||price<0||opening<0||minimum<0){$('invMasterMsg').textContent='Lengkapi kode, nama, satuan, dan angka yang valid.';return}
  b.disabled=true;
  const {error:e}=await supabase.from('spareparts').insert({part_code:code,part_name:name,category:$('invCategory').value.trim()||null,unit:$('invUnit').value.trim(),avg_unit_cost:0,stock_on_hand:0,minimum_stock:minimum});
  if(e){$('invMasterMsg').textContent='Gagal menyimpan: '+e.message;b.disabled=false;return}
  if(opening>0){const {data:created,error:findErr}=await supabase.from('spareparts').select('id').eq('part_code',code).single();if(findErr){$('invMasterMsg').textContent='Master tersimpan, tetapi ID sparepart gagal dibaca: '+findErr.message;b.disabled=false;return}const {error:te}=await supabase.rpc('receive_sparepart_stock',{p_sparepart_id:created.id,p_quantity:opening,p_unit_cost:price,p_supplier:'Saldo awal',p_transaction_date:new Date().toISOString().slice(0,10)});if(te){$('invMasterMsg').textContent='Master tersimpan, tetapi stok awal gagal dicatat: '+te.message;b.disabled=false;return}}
  $('invMasterMsg').className='msg success';$('invMasterMsg').textContent='Master sparepart berhasil disimpan.';await inventoryPage();
 };
 $('invReceive').onclick=async()=>{
  const b=$('invReceive'),id=$('invInPart').value,qty=Number($('invInQty').value),price=Number($('invInPrice').value);
  if(!id||qty<=0||price<0){$('invInMsg').textContent='Pilih barang dan isi jumlah serta harga dengan benar.';return}
  b.disabled=true;b.textContent='Menyimpan...';
  const {data,error:e}=await supabase.rpc('receive_sparepart_stock',{p_sparepart_id:id,p_quantity:qty,p_unit_cost:price,p_supplier:$('invInSupplier').value.trim()||null,p_transaction_date:$('invInDate').value||new Date().toISOString().slice(0,10)});
  if(e){$('invInMsg').textContent='Stok masuk gagal: '+e.message;b.disabled=false;b.textContent='Catat Stok Masuk';return}
  $('invInMsg').className='msg success';$('invInMsg').textContent='Stok masuk berhasil dicatat. Harga rata-rata modal diperbarui.';await inventoryPage();
 };
 const {data:tx,error:txe}=await supabase.from('stock_transactions').select('id,transaction_date,transaction_type,quantity,unit_cost,supplier,notes,spareparts(part_code,part_name,unit)').order('created_at',{ascending:false}).limit(100);
 if(txe){$('invHistory').textContent='Riwayat belum dapat dimuat: '+txe.message;return}
 $('invHistory').innerHTML=tx?.length?'<div class="scroll"><table><thead><tr><th>Tanggal</th><th>Jenis</th><th>Sparepart</th><th>Jumlah</th><th>Harga/unit</th><th>Total</th><th>Supplier / Catatan</th></tr></thead><tbody>'+tx.map(x=>`<tr><td>${esc(x.transaction_date)}</td><td>${esc(x.transaction_type)}</td><td>${esc(x.spareparts?.part_code)} — ${esc(x.spareparts?.part_name)}</td><td>${Number(x.quantity)} ${esc(x.spareparts?.unit)}</td><td>${money(x.unit_cost)}</td><td>${money(Number(x.quantity)*Number(x.unit_cost))}</td><td>${esc(x.supplier||x.notes)}</td></tr>`).join('')+'</tbody></table></div>':'Belum ada transaksi.';
}


window.editSparepart=async(id)=>{
 const money=n=>'Rp '+Number(n||0).toLocaleString('id-ID');
 const box=$('editSparepartPanel');if(!box)return;
 const {data:x,error}=await supabase.from('spareparts').select('id,part_code,part_name,category,unit,minimum_stock,is_active,stock_on_hand,avg_unit_cost').eq('id',id).single();
 if(error){box.innerHTML='<div class="card msg">Gagal memuat sparepart: '+esc(error.message)+'</div>';return}
 box.innerHTML=`<div class="card" style="margin-top:12px"><h4>Edit Master Sparepart</h4>

async function damageAnalysisPage(){

 const box=$('damageSummary'),load=$('damageLoad');
 async function fetchAll(table,select,order='created_at'){
  const out=[];const size=1000;let from=0;
  while(true){
   const {data,error}=await supabase.from(table).select(select).order(order,{ascending:true}).range(from,from+size-1);
   if(error)throw new Error(table+': '+error.message);

 }

 }catch(e){box.innerHTML='<p class="msg">Gagal memuat analisis: '+esc(e.message)+'</p>';load.textContent='';return}
 const months=[...new Set(rows.map(w=>String(w.work_date||w.request_date||w.created_at||'').slice(0,7)).filter(x=>/^\d{4}-\d{2}$/.test(x)))].sort().reverse();
 $('damageMonth').innerHTML='<option value="all">Seluruh riwayat SPK ('+rows.length+')</option>'+months.map(m=>`<option value="${m}">${m}</option>`).join('');
 const rules=[
  ['Sistem Rem',/rem|brake|kampas|kaliper|caliper|angin bocor|selang rem|chamber/i],
  ['Mesin',/mesin|engine|overheat|oli mesin|kompresi|turbo|injektor|injector|tenaga drop|asap knalpot/i],
  ['Kelistrikan & Sensor',/listrik|kelistrikan|aki|accu|alternator|dinamo|starter|kabel|sekring|fuse|lampu|sensor|ecu/i],
  ['Sistem AC',/\bac\b|air conditioner|kompresor ac|kondensor|evaporator|freon|blower/i],
  ['Transmisi & Kopling',/transmisi|gearbox|persneling|gigi|kopling|clutch|clutch booster|shift/i],
  ['Suspensi & Kaki-kaki',/suspensi|per daun|peer|shock|bushing|baut roda|bearing roda|hub roda|as roda/i],
  ['Kemudi',/steering|power steering|steering box|tie rod|drag link|long tie rod|setir|kemudi/i],
  ['Sistem Bahan Bakar',/solar|bahan bakar|fuel|filter solar|pompa solar|fuel pump|common rail/i],
  ['Pendingin Mesin',/radiator|coolant|air radiator|water pump|kipas radiator|fan belt|thermostat/i],
  ['Ban & Roda',/ban|tire|tyre|velg|pelek|roda|pentil/i],
  ['Sistem Udara',/kompresor angin|air dryer|tabung angin|angin|pneumatik|pneumatic/i],
  ['Trailer & Penghubung',/trailer|king pin|fifth wheel|landing gear|gandar trailer|rem trailer/i]
 ];
 const asset=w=>w.vehicles?.plate_number||w.trailers?.trailer_code||(w.vehicle_id?'Unit':'Trailer');
 const money=n=>'Rp '+Number(n||0).toLocaleString('id-ID');
 const render=()=>{
  const period=$('damageMonth').value;
  const filtered=rows.filter(w=>period==='all'||String(w.work_date||w.request_date||w.created_at||'').slice(0,7)===period);
  const ids=new Set(filtered.map(w=>w.id));
  const selectedCosts=costs.filter(c=>ids.has(c.work_order_id));
  const groups={},assetCounts={},assetCategory={},spares={};
  filtered.forEach(w=>{
   const txt=[w.complaint,w.repair_reason,w.result_notes].filter(Boolean).join(' ').toLowerCase();
   const category=(rules.find(r=>r[1].test(txt))||['Belum Terklasifikasi'])[0];
   (groups[category]??=[]).push(w);
   const a=asset(w);assetCounts[a]=(assetCounts[a]||0)+1;
   const key=a+'||'+category;assetCategory[key]=(assetCategory[key]||0)+1;
  });
  selectedCosts.forEach(c=>{const name=String(c.item_name||'').trim();if(name){const k=name.toLowerCase();if(!spares[k])spares[k]={name,count:0,qty:0,cost:0};spares[k].count++;spares[k].qty+=Number(c.quantity||0);spares[k].cost+=Number(c.total_amount??Number(c.quantity||0)*Number(c.unit_price||0));}});
  const ranked=Object.entries(groups).sort((a,b)=>b[1].length-a[1].length),total=filtered.length||1;
  const topAssets=Object.entries(assetCounts).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const repeats=Object.entries(assetCategory).filter(([,n])=>n>=2).sort((a,b)=>b[1]-a[1]).slice(0,20);
  const topSpares=Object.values(spares).sort((a,b)=>b.count-a.count).slice(0,15);
  const approved=selectedCosts.filter(c=>String(c.approval_status||'').toLowerCase()==='approved');
  const draft=selectedCosts.filter(c=>String(c.approval_status||'').toLowerCase()==='draft');
  const sumCost=arr=>arr.reduce((s,c)=>s+Number(c.total_amount??Number(c.quantity||0)*Number(c.unit_price||0)),0);
  const costByAsset={};approved.forEach(c=>{const w=filtered.find(x=>x.id===c.work_order_id);const a=w?asset(w):(c.vehicle_id||c.trailer_id||'Aset tidak diketahui');costByAsset[a]=(costByAsset[a]||0)+Number(c.total_amount??Number(c.quantity||0)*Number(c.unit_price||0));});
  const costRows=Object.entries(costByAsset).sort((a,b)=>b[1]-a[1]).slice(0,10);
  box.innerHTML=`<div class="card"><div class="grid">
   <div><div class="muted">SPK dianalisis</div><h2>${filtered.length}</h2></div>
   <div><div class="muted">Kategori terdeteksi</div><h2>${ranked.filter(x=>x[0]!=='Belum Terklasifikasi').length}</h2></div>
   <div><div class="muted">Belum terklasifikasi</div><h2>${(groups['Belum Terklasifikasi']||[]).length}</h2></div>
   <div><div class="muted">Total biaya disetujui</div><h2>${money(sumCost(approved))}</h2></div>
   <div><div class="muted">Biaya masih Draft</div><h2>${money(sumCost(draft))}</h2></div>
  </div></div>
  <div class="card"><h4>Jenis Kerusakan Paling Sering</h4>${ranked.length?'<div class="scroll"><table><thead><tr><th>Kategori</th><th>Jumlah SPK</th><th>Persentase</th></tr></thead><tbody>'+ranked.map(([name,list])=>`<tr><td><b>${esc(name)}</b></td><td>${list.length}</td><td>${(list.length/total*100).toFixed(1)}%</td></tr>`).join('')+'</tbody></table></div>':'Belum ada data SPK.'}</div>
  <div class="card"><h4>Unit dengan SPK Terbanyak</h4>${topAssets.length?'<div class="scroll"><table><thead><tr><th>Unit / Trailer</th><th>Jumlah SPK</th></tr></thead><tbody>'+topAssets.map(([a,n])=>`<tr><td>${esc(a)}</td><td>${n}</td></tr>`).join('')+'</tbody></table></div>':'Belum ada data.'}</div>
  <div class="card"><h4>Indikasi Kerusakan Berulang pada Aset yang Sama</h4><p class="muted">Ditandai jika kategori utama yang sama muncul minimal dua kali pada aset yang sama. Ini indikasi untuk ditinjau, bukan bukti komponen yang sama rusak kembali.</p>${repeats.length?'<div class="scroll"><table><thead><tr><th>Aset</th><th>Kategori</th><th>Jumlah SPK</th></tr></thead><tbody>'+repeats.map(([k,n])=>{const [a,c]=k.split('||');return `<tr><td>${esc(a)}</td><td>${esc(c)}</td><td>${n}</td></tr>`}).join('')+'</tbody></table></div>':'Belum ditemukan kategori berulang.'}</div>
  <div class="card"><h4>Sparepart / Item yang Paling Sering Dicatat</h4><p class="muted">Dihitung dari nama item pada rincian biaya SPK. Status Draft dan Approved ditampilkan dalam frekuensi; nilai biaya disetujui dihitung terpisah.</p>${topSpares.length?'<div class="scroll"><table><thead><tr><th>Nama Item</th><th>Jumlah baris</th><th>Total Qty</th><th>Nilai tercatat</th></tr></thead><tbody>'+topSpares.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.count}</td><td>${x.qty}</td><td>${money(x.cost)}</td></tr>`).join('')+'</tbody></table></div>':'Belum ada rincian item biaya.'}</div>
  <div class="card"><h4>Biaya Disetujui per Aset (Top 10)</h4>${costRows.length?'<div class="scroll"><table><thead><tr><th>Aset</th><th>Biaya disetujui</th></tr></thead><tbody>'+costRows.map(([a,n])=>`<tr><td>${esc(a)}</td><td>${money(n)}</td></tr>`).join('')+'</tbody></table></div>':'Belum ada biaya disetujui pada periode ini.'}</div>
  <div class="card"><h4>Detail SPK per Kategori</h4><p class="muted">Keluhan, pekerjaan, dan catatan hasil ditampilkan untuk pemeriksaan klasifikasi.</p>${ranked.map(([name,list])=>`<details style="border-bottom:1px solid #e2e8f0;padding:10px 0"><summary><b>${esc(name)}</b> — ${list.length} SPK</summary><div class="scroll"><table><thead><tr><th>No. SPK</th><th>Tanggal</th><th>Aset</th><th>Keluhan</th><th>Pekerjaan / Perbaikan</th><th>Hasil</th></tr></thead><tbody>${list.map(w=>`<tr><td>${esc(w.spk_number)}</td><td>${esc(w.work_date||w.request_date||String(w.created_at||'').slice(0,10))}</td><td>${esc(asset(w))}</td><td>${esc(w.complaint)}</td><td>${esc(w.repair_reason)}</td><td>${esc(w.result_notes)}</td></tr>`).join('')}</tbody></table></div></details>`).join('')}</div>
  <p class="muted">Catatan: kategori otomatis berdasarkan kata kunci dan hanya satu kategori utama per SPK. Hasilnya adalah penyaringan awal, bukan diagnosis teknis otomatis. Pastikan keluhan, pekerjaan, dan hasil pemeriksaan di SPK terisi dengan konsisten.</p>`;
 };
 load.textContent=`Data berhasil dimuat: ${rows.length} SPK dan ${costs.length} rincian biaya. Tidak ada data yang diubah.`;

}

async function loadMonthlyReport(month){
 const box=$('monthlyReportResult');box.innerHTML='Mengambil data laporan...';
 if(!month){box.textContent='Pilih bulan laporan terlebih dahulu.';return}
 const [woR,costR,downR,assignR,vehR,trR]=await Promise.all([
  supabase.from('work_orders').select('id,spk_number,vehicle_id,trailer_id,result_status,work_date,created_at,sa_registered_at,released_at,work_started_at,work_completed_at,vehicles(plate_number),trailers(trailer_code)'),
  supabase.from('work_order_costs').select('work_order_id,vehicle_id,trailer_id,transaction_date,total_amount,quantity,unit_price,approval_status,item_name'),
  supabase.from('downtime_records').select('vehicle_id,trailer_id,start_time,end_time,reason,downtime_status'),
  supabase.from('work_order_assignments').select('work_order_id,mechanic_id,mechanics(name)'),
  supabase.from('vehicles').select('id,plate_number'),
  supabase.from('trailers').select('id,trailer_code')
 ]);
 const err=[woR,costR,downR,assignR,vehR,trR].find(r=>r.error);
 if(err){box.innerHTML='<p class="msg">Gagal mengambil laporan: '+esc(err.error.message)+'</p>';return}
 const start=month+'-01',end=new Date(Number(month.slice(0,4)),Number(month.slice(5,7)),0).toISOString().slice(0,10);
 const inRange=d=>!!d&&String(d).slice(0,10)>=start&&String(d).slice(0,10)<=end;
 const allWO=woR.data||[],wos=allWO.filter(w=>inRange(w.work_date||w.created_at));
 const ids=new Set(wos.map(w=>w.id)),done=wos.filter(w=>(w.result_status||'').toLowerCase()==='selesai').length;
 const costs=(costR.data||[]).filter(c=>inRange(c.transaction_date)&&String(c.approval_status||'').toLowerCase()==='approved');
 const totalCost=costs.reduce((a,c)=>a+Number(c.total_amount??Number(c.quantity||0)*Number(c.unit_price||0)),0);
 const downtime=(downR.data||[]).filter(d=>inRange(d.start_time));
 const downMs=downtime.reduce((a,d)=>a+(d.end_time?Math.max(0,new Date(d.end_time)-new Date(d.start_time)):0),0);
 const assignments=(assignR.data||[]).filter(a=>ids.has(a.work_order_id)),mechanics={};
 assignments.forEach(a=>{const key=a.mechanic_id||'unknown';if(!mechanics[key])mechanics[key]={name:a.mechanics?.name||'Mekanik tidak diketahui',assigned:0,done:0};mechanics[key].assigned++;if(wos.find(w=>w.id===a.work_order_id&&(w.result_status||'').toLowerCase()==='selesai'))mechanics[key].done++});
 const mechanicRows=Object.values(mechanics).sort((a,b)=>b.done-a.done);
 const assetNames={};(vehR.data||[]).forEach(v=>assetNames[v.id]=v.plate_number);(trR.data||[]).forEach(t=>assetNames[t.id]=t.trailer_code);
 const assetCosts={};costs.forEach(c=>{const id=c.vehicle_id||c.trailer_id||'unknown';if(!assetCosts[id])assetCosts[id]={name:assetNames[id]||'Aset tidak diketahui',amount:0};assetCosts[id].amount+=Number(c.total_amount??Number(c.quantity||0)*Number(c.unit_price||0))});
 const costRows=Object.values(assetCosts).sort((a,b)=>b.amount-a.amount);
 const prevMonth=new Date(Number(month.slice(0,4)),Number(month.slice(5,7))-1,0).toISOString().slice(0,7);
 const prevStart=prevMonth+'-01',prevEnd=new Date(Number(prevMonth.slice(0,4)),Number(prevMonth.slice(5,7)),0).toISOString().slice(0,10);
 const prevWO=allWO.filter(w=>{const d=String(w.work_date||w.created_at||'').slice(0,10);return d>=prevStart&&d<=prevEnd});
 const prevCost=(costR.data||[]).filter(c=>String(c.approval_status||'').toLowerCase()==='approved'&&inRangePrev(c.transaction_date,prevStart,prevEnd)).reduce((a,c)=>a+Number(c.total_amount??Number(c.quantity||0)*Number(c.unit_price||0)),0);
 function inRangePrev(d,a,b){const x=String(d||'').slice(0,10);return x>=a&&x<=b}
 const money=n=>'Rp '+Number(n||0).toLocaleString('id-ID');
 const avgRelease=wos.filter(w=>w.sa_registered_at&&w.released_at).map(w=>(new Date(w.released_at)-new Date(w.sa_registered_at))/60000).filter(x=>x>=0);
 const avgMin=avgRelease.length?Math.round(avgRelease.reduce((a,b)=>a+b,0)/avgRelease.length):null;
 const pct=wos.length?done/wos.length*100:0;
 box.innerHTML=`<div class="card"><h3>Ringkasan ${month}</h3><div class="grid">
 <div><div class="muted">Total SPK</div><h2>${wos.length}</h2></div><div><div class="muted">SPK Selesai</div><h2>${done} (${pct.toFixed(1)}%)</h2></div><div><div class="muted">Belum Selesai</div><h2>${wos.length-done}</h2></div><div><div class="muted">Biaya disetujui</div><h2>${money(totalCost)}</h2></div>
 <div><div class="muted">Downtime tercatat</div><h2>${downtime.length} kejadian</h2></div><div><div class="muted">Durasi downtime selesai</div><h2>${(downMs/3600000).toFixed(1)} jam</h2></div><div><div class="muted">Rata-rata registrasi ke release</div><h2>${avgMin===null?'-':avgMin+' menit'}</h2></div></div></div>
 <div class="card"><h4>Perbandingan dengan ${prevMonth}</h4><table><thead><tr><th>Indikator</th><th>${prevMonth}</th><th>${month}</th><th>Perubahan</th></tr></thead><tbody>
 <tr><td>Total SPK</td><td>${prevWO.length}</td><td>${wos.length}</td><td>${wos.length-prevWO.length>=0?'+':''}${wos.length-prevWO.length}</td></tr>
 <tr><td>Biaya disetujui</td><td>${money(prevCost)}</td><td>${money(totalCost)}</td><td>${money(totalCost-prevCost)}</td></tr></tbody></table></div>

 <div class="card"><h4>Biaya per Unit / Trailer</h4>${costRows.length?'<div class="scroll"><table><thead><tr><th>Aset</th><th>Biaya disetujui</th></tr></thead><tbody>'+costRows.map(c=>`<tr><td>${esc(c.name)}</td><td>${money(c.amount)}</td></tr>`).join('')+'</tbody></table></div>':'Belum ada biaya disetujui pada bulan ini.'}</div>

function pmDateStatus(due){
 const today=new Date();today.setHours(0,0,0,0);
 const d=new Date(due+'T00:00:00');
 const days=Math.ceil((d-today)/86400000);
 if(days<0)return {label:'Terlambat '+Math.abs(days)+' hari',color:'#b42318'};
 if(days<=30)return {label:days===0?'Jatuh tempo hari ini':'Jatuh tempo '+days+' hari lagi',color:'#b54708'};
 return {label:'Terjadwal',color:'#067647'};
}
function addMonthsISO(dateStr,months){
 const d=new Date(dateStr+'T00:00:00');
 const day=d.getDate();
 d.setDate(1);d.setMonth(d.getMonth()+months);
 const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
 d.setDate(Math.min(day,last));
 return d.toISOString().slice(0,10);
}

async function savePmSchedule(){

 if(!id){msg.textContent='Pilih unit kendaraan terlebih dahulu.';return}

 if(!entries.length){msg.textContent='Isi minimal satu tanggal terakhir perawatan.';return}

async function loadPmRows(){
 const box=$('pmRows');if(!box)return;
 box.textContent='Memuat jadwal PM...';
 let q=supabase.from('pm_schedules').select('id,vehicle_id,pm_type,interval_months,last_service_date,next_due_date,notes,vehicles(plate_number,brand,model)').order('next_due_date');
 const vehicle=$('pmFilterVehicle')?.value,status=$('pmFilterStatus')?.value;
 if(vehicle)q=q.eq('vehicle_id',vehicle);
 const {data,error}=await q.limit(2000);
 if(error){box.textContent='Gagal memuat jadwal PM: '+error.message;return}
 const allRows=(data||[]).map(x=>({...x,_status:pmDateStatus(x.next_due_date)}));
 // Ringkasan dihitung per kendaraan, bukan per baris PM, agar satu unit tidak dihitung berulang.
 const byVehicle=new Map();
 for(const x of allRows){
  if(!byVehicle.has(x.vehicle_id))byVehicle.set(x.vehicle_id,{vehicle_id:x.vehicle_id,plate:x.vehicles?.plate_number,states:[]});
  byVehicle.get(x.vehicle_id).states.push(x._status);
 }
 const summary={late:0,soon:0,normal:0};
 for(const unit of byVehicle.values()){
  if(unit.states.some(x=>x.label.startsWith('Terlambat')))summary.late++;
  else if(unit.states.some(x=>x.label!=='Terjadwal'))summary.soon++;
  else summary.normal++;
 }
 const totalVehicles=vehiclesCountCache ?? null;
 const summaryEl=$('pmSummary');
 if(summaryEl){
  const unscheduled=totalVehicles===null?null:Math.max(0,totalVehicles-byVehicle.size);
  const tiles=[['Terlambat',summary.late,'#b42318'],['Segera jatuh tempo',summary.soon,'#b54708'],['Terjadwal',summary.normal,'#067647'],['Belum ada jadwal',unscheduled===null?'—':unscheduled,'#475467']];
  summaryEl.innerHTML=tiles.map(([label,value,color])=>`<div class="card" style="margin:0;padding:14px"><div class="muted">${label}</div><div style="font-size:26px;font-weight:bold;color:${color}">${value}</div><small class="muted">unit</small></div>`).join('');
 }
 let rows=allRows;
 if(status==='late')rows=rows.filter(x=>x._status.label.startsWith('Terlambat'));
 if(status==='soon')rows=rows.filter(x=>!x._status.label.startsWith('Terlambat')&&!x._status.label.includes('Terjadwal'));
 if(status==='normal')rows=rows.filter(x=>x._status.label==='Terjadwal');
 if(!rows.length){box.innerHTML='<p class="muted">Belum ada jadwal PM untuk filter ini. Input tanggal terakhir PM untuk mulai membuat jadwal.</p>';return}
 box.innerHTML='<div class="scroll"><table><thead><tr><th>Unit</th><th>Jenis PM</th><th>Terakhir dilakukan</th><th>Interval</th><th>Jatuh tempo</th><th>Status</th></tr></thead><tbody>'+rows.map(x=>{
  const t=pmTypes.find(y=>y.key===x.pm_type);
  return `<tr><td>${esc(x.vehicles?.plate_number)}<br><small>${esc([x.vehicles?.brand,x.vehicles?.model].filter(Boolean).join(' '))}</small></td><td>${esc(t?.label||x.pm_type)}</td><td>${esc(x.last_service_date)}</td><td>${x.interval_months} bulan</td><td>${esc(x.next_due_date)}</td><td><span class="tag" style="color:${x._status.color}">${esc(x._status.label)}</span></td></tr>`;
 }).join('')+'</tbody></table></div>';
}
