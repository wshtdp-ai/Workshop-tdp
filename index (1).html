<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#12345a"><link rel="manifest" href="manifest.webmanifest">
<title>TDP Workshop</title>
<style>
:root{font-family:Arial,sans-serif;color:#172334;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}
header{background:#12345a;color:white;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:20px;margin:0}main{max-width:1000px;margin:24px auto;padding:0 16px}
.card{background:white;border:1px solid #dce3eb;border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px #1020300a}
input,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #cbd5e1;width:100%;margin:6px 0}
button{background:#12345a;color:white;border:0;font-weight:bold;cursor:pointer}button.secondary{background:#e7edf5;color:#12345a}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.hidden{display:none}.muted{color:#64748b;font-size:13px}.stat{font-size:26px;font-weight:bold;margin-top:8px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}nav button{width:auto;padding:10px 14px}
#status{white-space:pre-wrap;font-size:13px;color:#b42318}
</style>
</head>
<body>
<header><div><h1>Workshop PT TRANS DAYA PRIMA</h1><small>Manajemen unit · SPK · Preventive Maintenance</small></div><button id="logout" class="secondary hidden" style="width:auto">Keluar</button></header>
<main>
<section id="setup" class="card">
<h2>Pengaturan koneksi Supabase</h2>
<p class="muted">Isi alamat proyek dan anon/publishable key dari Supabase. Jangan masukkan service_role key.</p>
<label>Project URL</label><input id="url" placeholder="https://xxxx.supabase.co">
<label>Anon / Publishable key</label><input id="key" placeholder="Supabase anon atau publishable key">
<button id="saveConfig">Simpan koneksi</button><p id="setupStatus" class="muted"></p>
</section>
<section id="login" class="card hidden">
<h2>Masuk ke Workshop TDP</h2><input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">Masuk</button><p id="loginStatus"></p>
</section>
<section id="app" class="hidden">
<div class="card"><h2 id="welcome">Dashboard</h2><p id="role" class="muted"></p>
<nav><button data-page="dashboard">Dashboard</button><button data-page="vehicles">Master Unit</button><button data-page="spk">SPK</button><button data-page="pm">Preventive Maintenance</button></nav>
<div id="page"></div></div>
</section>
</main>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const $=id=>document.getElementById(id);
let supabase=null, currentProfile=null;
function status(el,msg){$(el).textContent=msg}
function config(){
 const url=localStorage.getItem('tdp_supabase_url'), key=localStorage.getItem('tdp_supabase_key');
 if(url&&key){$('url').value=url;$('key').value=key;supabase=createClient(url,key);$('setup').classList.add('hidden');$('login').classList.remove('hidden')}
}
$('saveConfig').onclick=()=>{
 const url=$('url').value.trim(),key=$('key').value.trim();
 if(!url.startsWith('https://')||!key){status('setupStatus','Periksa Project URL dan key.');return}
 localStorage.setItem('tdp_supabase_url',url);localStorage.setItem('tdp_supabase_key',key);
 supabase=createClient(url,key);$('setup').classList.add('hidden');$('login').classList.remove('hidden');
};
$('loginBtn').onclick=async()=>{
 status('loginStatus','Memeriksa akun...');
 const {data,error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
 if(error){status('loginStatus',error.message);return}
 const {data:p,error:pe}=await supabase.from('profiles').select('full_name,roles').eq('id',data.user.id).single();
 if(pe){status('loginStatus','Login berhasil, tetapi profil belum terbaca: '+pe.message);return}
 currentProfile=p;
 $('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');
 $('welcome').textContent='Selamat datang, '+(p.full_name||'Pengguna');
 $('role').textContent='Hak akses: '+(p.roles||[]).join(', ');
 showPage('dashboard');
};
async function showPage(name){
 const page=$('page');
 if(name==='dashboard'){page.innerHTML='<h3>Dashboard Workshop</h3><p>Fondasi aplikasi sudah terhubung. Modul akan diaktifkan setelah struktur tabel diperiksa.</p><div class="grid"><div class="card"><b>Master Unit</b><p class="muted">Data kendaraan TDP</p></div><div class="card"><b>SPK</b><p class="muted">Work order perbaikan</p></div><div class="card"><b>Preventive Maintenance</b><p class="muted">Jadwal dan catatan PM</p></div></div>';return}
 if(name==='vehicles'){
   const admin=(currentProfile.roles||[]).includes('admin');
   page.innerHTML='<h3>Master Unit</h3><p>Admin dapat melihat data unit. Penambahan dan perubahan unit dilakukan oleh Kepala Workshop.</p><div id="vehicleRows" class="muted">Memuat data...</div>';
   const {data,error}=await supabase.from('vehicles').select('*').limit(100);
   if(error){$('vehicleRows').textContent='Data belum dapat dimuat: '+error.message;return}
   if(!data.length){$('vehicleRows').textContent='Belum ada data unit.';return;}
   const esc=v=>String(v??'-').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
   const rows=data.map((v,i)=>`<tr><td>${i+1}</td><td>${esc(v.plate_number)}</td><td>${esc(v.brand)}</td><td>${esc(v.vehicle_type)}</td><td>${esc(v.model)}</td><td>${esc(v.year)}</td><td>${esc(v.status)}</td></tr>`).join('');
   $('vehicleRows').innerHTML=`<p class="muted">Jumlah unit terbaca: ${data.length}</p><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:14px"><thead><tr style="background:#eaf0f7;text-align:left"><th style="padding:10px">No.</th><th style="padding:10px">Nomor Polisi</th><th style="padding:10px">Merek</th><th style="padding:10px">Jenis</th><th style="padding:10px">Model</th><th style="padding:10px">Tahun</th><th style="padding:10px">Status</th></tr></thead><tbody>${rows}</tbody></table></div>`;
   return;
 }
 const table=name==='spk'?'work_orders':'pm_records';
 page.innerHTML='<h3>'+(name==='spk'?'SPK / Work Order':'Preventive Maintenance')+'</h3><p class="muted">Modul ini akan disesuaikan dengan kolom tabel yang sudah dibuat di proyek Supabase TDP.</p><div id="moduleRows">Memuat data...</div>';
 const {data,error}=await supabase.from(table).select('*').limit(50);
 $('moduleRows').textContent=error?'Belum dapat dimuat: '+error.message:JSON.stringify(data,null,2);
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>showPage(b.dataset.page));
$('logout').onclick=async()=>{await supabase.auth.signOut();location.reload()};
config();
</script>
</body></html>
